            }, [unfoldStarted]);
            const [isUnfolding, setIsUnfolding] = useState(false); // True while the unfold animation is actively playing
            const [unfoldT, setUnfoldT] = useState(0); // Animation progress, 0 (looped) to 1 (unfolded into table)
            const [workHeatPlacements, setWorkHeatPlacements] = useState({}); // e.g. {PUMP: 'Work In', BOILER: 'Heat In', ...}
            const [whMorphed, setWhMorphed] = useState(false); // Once true, all pills crossfade from full name to abbreviation together, during the unfold
            const [whShowFull, setWhShowFull] = useState(false); // Once true, pills reveal their full component name before later morphing to the abbreviation
            const [hOnlyView, setHOnlyView] = useState(false); // When true, the table hides P/T/s/x rows and shows only h
            const [activeEqComponent, setActiveEqComponent] = useState(null); // Which component's equation is currently being built
            const [eqBuilderClicks, setEqBuilderClicks] = useState([]); // Clicks so far for the active component: [{type:'h', state:n}, {type:'pill'}, ...]
            const [equationAttempts, setEquationAttempts] = useState({}); // e.g. {PUMP: {before: 1, after: 2}, ...} - the student's built equation per component
            const [eqCheckResult, setEqCheckResult] = useState(null); // e.g. {PUMP: {beforeCorrect: true, afterCorrect: false}, ...} once checked
            const [eqRevealTier, setEqRevealTier] = useState(0); // 0 = nothing revealed, 1 = which equations are wrong, 2 = which part is wrong
            const [energyValueIndex, setEnergyValueIndex] = useState(0); // Which of the 6 components we're currently solving (in order)
            const [energyResults, setEnergyResults] = useState({}); // e.g. {PUMP: 10.1, ...} - computed numeric energy values
            // Cycle Performance phase: which component currently sits in each equation slot.
            // Keyed by group ('wnet'/'qtotal') -> array of component names (or null), one per slot.
            const [cyclePerfSlots, setCyclePerfSlots] = useState({ wnet: [null, null, null], qtotal: [null, null] });
            const [cyclePerfStage, setCyclePerfStage] = useState(0); // 0 = building equations, 1 = w_net/q_total calculated, 2 = efficiency calculated
            const [wNetValue, setWNetValue] = useState(null);
            const [qTotalValue, setQTotalValue] = useState(null);
            const [etaValue, setEtaValue] = useState(null);
            const [cyclePerfHasChecked, setCyclePerfHasChecked] = useState(false); // Has "Check placement" been pressed since the last edit
            const [cyclePerfRevealTier, setCyclePerfRevealTier] = useState(0); // 0 = nothing revealed, 1 = which equation is wrong, 2 = which slot is wrong
            const [cyclePerfEtaStep, setCyclePerfEtaStep] = useState(0); // 0 = symbolic formula shown, 1 = real numbers substituted, ready to calculate
            const [energyPlacements, setEnergyPlacements] = useState({}); // Committed to the table only after the unfold animation finishes
            const [whUnfoldStarted, setWhUnfoldStarted] = useState(false);
            const [isWhUnfolding, setIsWhUnfolding] = useState(false);
            const [whUnfoldT, setWhUnfoldT] = useState(0);
            const [isoConnections, setIsoConnections] = useState([]);
            const [pinkHighlights, setPinkHighlights] = useState([]);
            const [givenValues, setGivenValues] = useState({}); // Store actual values like {state3-P: '10 MPa'}
            const [blueHighlights, setBlueHighlights] = useState([]);
            const [draggedItem, setDraggedItem] = useState(null);
            const [dragFromCell, setDragFromCell] = useState(null);
            const [hoveredCell, setHoveredCell] = useState(null);
            const [mousePosition, setMousePosition] = useState({ x: 0, y: 0 });
            const [errorMessage, setErrorMessage] = useState('');
            const [stateNumbering, setStateNumbering] = useState({}); // Maps arrow positions to state numbers
            const [selectedState, setSelectedState] = useState(null); // Track which state is selected in solve-states phase
            const [clickedCells, setClickedCells] = useState([]); // Track cells clicked for solving
            
            // New queue-based solving structure
            const [solveQueue, setSolveQueue] = useState([]); // Array of {find: cellId, using: [cellId, cellId]}
            const [currentFind, setCurrentFind] = useState(null); // Current property being found
            const [currentUsing, setCurrentUsing] = useState([]); // Current using properties
            const [solvingMode, setSolvingMode] = useState('finding'); // 'finding' or 'using'
            
            const [calculatedCells, setCalculatedCells] = useState([]); // Cells calculated by CoolProp
            const [isSolving, setIsSolving] = useState(false); // Track if solve request is in progress
            const [showStuckModal, setShowStuckModal] = useState(false); // "Stuck?" reasoning modal
            const [x1PillRevealed, setX1PillRevealed] = useState(false); // x1 pill available to drag, post-reveal
            const [menuOpen, setMenuOpen] = useState(false); // Hamburger menu (top-right)
            // The merged ISO Processes phase has two sequential sub-steps: connect the
            // isentropic/isobaric processes first, then drag known values across those
            // connections. 'connect' === old process-type phase, 'derive' === old
            // derivable-values phase.
            const [isoSubStep, setIsoSubStep] = useState('connect');
            const [showCoolPropHelp, setShowCoolPropHelp] = useState(false); // Toggle for the CoolProp reference/legend panel
            // Persists across the whole solve-states phase (not per-state, not cleared on
            // Solve) - every successfully solved line accumulates here so the student can
            // collect the full set of CoolProp code for the system.
            const [solvedCodeLog, setSolvedCodeLog] = useState([]);
            const [codePreviewExpanded, setCodePreviewExpanded] = useState(false);
            const [showCopyToast, setShowCopyToast] = useState(false);
            
            // Randomize component order once on mount
            const [shuffledComponents] = useState(() => {
                const components = [...LEVEL_1.components];
                // Fisher-Yates shuffle
                for (let i = components.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [components[i], components[j]] = [components[j], components[i]];
                }
                return components;
            });
            
            // Component-id phase: pointer-based drag-and-drop for both the component pills
            // and the state-number pills. This replaced native HTML5 drag-and-drop, which
            // dragged elements out of an SVG <foreignObject> - an unusual combination that
            // appears to have been the source of an intermittent full-browser crash on Edge/
            // Windows after repeated drags (likely native drag-image generation not fully
            // releasing memory when the dragged content lives inside foreignObject).
            //
            // The drag itself is handled with NO React state at all - pointermove fires far
            // too often (dozens of times a second) to route through setState here, since this
            // component's re-render touches the whole page (diagram, full property table,
            // checklist). Instead we mutate the dragged DOM node's own style directly, so
            // moving the pointer never triggers React at all. React only gets involved once,
            // at drop, to commit the actual placement.
            const placeComponent = (position, draggedComponent) => {
                setDiagramPlacements(prev => {
                    const targetPositionComponent = prev[position];
                    const sourcePosition = Object.keys(prev).find(key => prev[key] === draggedComponent);
                    const next = { ...prev };
                    if (sourcePosition) {
                        if (targetPositionComponent) {
                            // SWAP: both positions occupied
                            next[sourcePosition] = targetPositionComponent;
                            next[position] = draggedComponent;
                        } else {
                            // MOVE: target position is empty
                            delete next[sourcePosition];
                            next[position] = draggedComponent;
                        }
                    } else {
                        // Dragged from the tray (first placement) - only place if empty
                        if (!targetPositionComponent) {
                            next[position] = draggedComponent;
                        }
                    }
                    return next;
                });
            };

            const placeStateNumber = (arrowPosition, draggedNumber) => {
                setStateNumbering(prev => {
                    const targetPositionNumber = prev[arrowPosition];
                    const sourcePosition = Object.keys(prev).find(key => prev[key] === draggedNumber);
                    const next = { ...prev };
                    if (sourcePosition) {
                        if (targetPositionNumber) {
                            next[sourcePosition] = targetPositionNumber;
                            next[arrowPosition] = draggedNumber;
                        } else {
                            delete next[sourcePosition];
                            next[arrowPosition] = draggedNumber;
                        }
                    } else {
                        if (!targetPositionNumber) {
                            next[arrowPosition] = draggedNumber;
                        }
                    }
                    return next;
                });
            };

            // itemType: 'component' | 'state-number'. sourcePosition is null when dragging
            // from the tray (first placement) rather than moving/swapping an already-placed one.
            const startPointerDrag = (itemType, key, sourcePosition) => (e) => {
                e.preventDefault();
                const el = e.currentTarget;
                const startX = e.clientX, startY = e.clientY;
                const rect = el.getBoundingClientRect();

                // Animating the real tile is expensive here specifically because the diagram
                // slots and arrow badges live inside an SVG <foreignObject> - most browser
                // engines repaint foreignObject content far less cheaply than ordinary HTML,
                // no matter how well-throttled the JS driving it is. So instead of moving the
                // real tile, hide it and float a lightweight plain-HTML "ghost" over it,
                // positioned `fixed` and living outside the SVG entirely - the same kind of
                // element the tray-to-slot drags in Energy Rearrange and Cycle Performance
                // already animate cheaply.
                const originalVisibility = el.style.visibility;
                el.style.visibility = 'hidden';

                const ghost = document.createElement('div');
                ghost.textContent = String(key);
                ghost.className = itemType === 'component'
                    ? 'bg-purple-100 border-2 border-purple-400 rounded-lg font-bold text-purple-700 flex items-center justify-center'
                    : 'bg-indigo-100 border-2 border-indigo-400 rounded-full font-bold text-indigo-700 flex items-center justify-center';
                ghost.style.position = 'fixed';
                ghost.style.left = `${rect.left}px`;
                ghost.style.top = `${rect.top}px`;
                ghost.style.width = `${rect.width}px`;
                ghost.style.height = `${rect.height}px`;
                ghost.style.fontSize = '13px';
                ghost.style.pointerEvents = 'none';
                ghost.style.zIndex = '9999';
                ghost.style.willChange = 'transform';
                document.body.appendChild(ghost);

                // A mouse or trackpad can fire pointermove faster than the screen repaints.
                // Writing to style on every raw event does redundant work between frames the
                // browser can't even show - track the latest position and only apply it once
                // per animation frame instead.
                let latestDx = 0, latestDy = 0, rafId = null;
                const applyTransform = () => {
                    ghost.style.transform = `translate(${latestDx}px, ${latestDy}px)`;
                    rafId = null;
                };
                const onMove = (ev) => {
                    latestDx = ev.clientX - startX;
                    latestDy = ev.clientY - startY;
                    if (rafId === null) {
                        rafId = requestAnimationFrame(applyTransform);
                    }
                };
                const onUp = (ev) => {
                    window.removeEventListener('pointermove', onMove);
                    window.removeEventListener('pointerup', onUp);
                    window.removeEventListener('pointercancel', onUp);
                    if (rafId !== null) {
                        cancelAnimationFrame(rafId);
                        rafId = null;
                    }

                    // The ghost has pointer-events:none for its entire life, so there's no
                    // ordering concern here the way there was animating the real tile -
                    // elementFromPoint always sees straight through it to the real target.
                    const dropEl = document.elementFromPoint(ev.clientX, ev.clientY);
                    const target = dropEl ? dropEl.closest('[data-drop-type]') : null;

                    document.body.removeChild(ghost);
                    el.style.visibility = originalVisibility;

                    if (target && target.dataset.dropType === itemType) {
                        if (itemType === 'component') {
                            placeComponent(target.dataset.dropKey, key);
                        } else if (itemType === 'state-number') {
                            placeStateNumber(target.dataset.dropKey, key);
                        }
                    }
                };
                window.addEventListener('pointermove', onMove);
                window.addEventListener('pointerup', onUp);
                window.addEventListener('pointercancel', onUp);
            };
            
            // Track mouse position during drag for rubber band effect
            React.useEffect(() => {
                if ((phase !== 'iso-processes' && phase !== 'solve-states') || !dragFromCell) return;
                
                const handleDragOver = (e) => {
                    // DragOver fires continuously as you drag
                    e.preventDefault();
                    setMousePosition({ x: e.clientX, y: e.clientY });
                };
                
                document.addEventListener('dragover', handleDragOver);
                return () => document.removeEventListener('dragover', handleDragOver);
            }, [phase, dragFromCell]);
            
            // Helper to advance phase and mark previous as complete
            // Helper to save current phase data as snapshot
            const savePhaseSnapshot = (phaseId) => {
                const snapshot = {};
                switch(phaseId) {
                    case 'component-id':
                        snapshot.diagramPlacements = {...diagramPlacements};
                        snapshot.stateNumbering = {...stateNumbering};
                        snapshot.componentPlacements = {...componentPlacements};
                        break;
                    case 'given-values':
                        snapshot.pinkHighlights = [...pinkHighlights];
                        snapshot.givenValues = {...givenValues};
                        break;
                    case 'iso-processes':
                        snapshot.isoConnections = [...isoConnections];
                        snapshot.isoSubStep = isoSubStep;
                        snapshot.blueHighlights = [...blueHighlights];
                        snapshot.givenValues = {...givenValues};
                        break;
                    case 'solve-states':
                        snapshot.givenValues = {...givenValues};
                        snapshot.calculatedCells = [...calculatedCells];
                        snapshot.x1PillRevealed = x1PillRevealed;
                        break;
                    case 'work-heat-id':
                        snapshot.workHeatPlacements = {...workHeatPlacements};
                        // Derived from workHeatPlacements rather than reading energyPlacements directly:
                        // by the time this phase advances, they're always equal, and reading
                        // energyPlacements here could capture a stale pre-update closure value.
                        snapshot.energyPlacements = {...workHeatPlacements};
                        break;
                    case 'energy-equations':
                        snapshot.hOnlyView = hOnlyView;
                        snapshot.equationAttempts = {...equationAttempts};
                        break;
                    case 'energy-values':
                        snapshot.energyValueIndex = energyValueIndex;
                        snapshot.energyResults = {...energyResults};
                        break;
                    case 'cycle-performance':
                        snapshot.cyclePerfSlots = { wnet: [...cyclePerfSlots.wnet], qtotal: [...cyclePerfSlots.qtotal] };
                        snapshot.cyclePerfStage = cyclePerfStage;
                        snapshot.wNetValue = wNetValue;
                        snapshot.qTotalValue = qTotalValue;
                        snapshot.etaValue = etaValue;
                        snapshot.cyclePerfHasChecked = cyclePerfHasChecked;
                        snapshot.cyclePerfRevealTier = cyclePerfRevealTier;
                        snapshot.cyclePerfEtaStep = cyclePerfEtaStep;
                        break;
                }
                return snapshot;
            };
            
            const advancePhase = (newPhase, scrollToTop = false) => {
                // Save snapshot of current phase before advancing
                const snapshot = savePhaseSnapshot(phase);
                setCompletedPhaseData(prev => ({...prev, [phase]: snapshot}));
                
                setCompletedPhases(prev => [...prev, phase]);
                setPhase(newPhase);
                // Scrolling to top isn't right for every transition - some phases continue
                // naturally further down the page. Only scroll when the caller asks for it
                // (e.g. Work & Heat Identification, where new content reappears at the top).
                if (scrollToTop) {
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }
            };

            // Check completion and correctness for component-id phase
            const isComponentIdComplete = () => {
                const correctPlacements = {
                    'PUMP': 'pump',
                    'BOILER': 'boiler',
                    'HP TURB': 'hp-turb',
                    'REHEATER': 'reheater',
                    'LP TURB': 'lp-turb',
                    'CONDENSER': 'condenser',
                };
                // Check if all positions are filled
                const allFilled = Object.keys(correctPlacements).every(comp =>
                    Object.values(diagramPlacements).includes(comp)
                );
                return allFilled;
            };
            
            const isComponentIdCorrect = () => {
                const correctPlacements = {
                    'PUMP': 'pump',
                    'BOILER': 'boiler',
                    'HP TURB': 'hp-turb',
                    'REHEATER': 'reheater',
                    'LP TURB': 'lp-turb',
                    'CONDENSER': 'condenser',
                };
                return Object.keys(correctPlacements).every(comp =>
                    diagramPlacements[correctPlacements[comp]] === comp
                );
            };

            // State numbering validation

            // Runs the unfold animation, then auto-fills componentPlacements and advances the phase
            const startUnfold = () => {
                setIsUnfolding(true);
                const duration = 2000;
                const start = performance.now();
                const step = (now) => {
                    const raw = Math.min(1, (now - start) / duration);
                    setUnfoldT(raw);
                    if (raw < 1) {
                        requestAnimationFrame(step);
                    } else {
                        // Hold on the fully-formed pills for a beat before advancing
                        setTimeout(() => {
                            setIsUnfolding(false);
                            const filled = {};
                            Object.entries(LEVEL_1.correctComponentPlacements).forEach(([comp, slot]) => {
                                filled[slot] = comp;
                            });
                            setComponentPlacements(filled);
                            advancePhase('given-values');
                        }, 900);
                    }
                };
                requestAnimationFrame(step);
            };

            // Checks every state has all required properties (P, T, h, s, plus x for states 1 and 6)
            const isAllStatesSolved = () => {
                const requiredCells = [];
                for (let n = 1; n <= 6; n++) {
                    requiredCells.push(`state${n}-P`, `state${n}-T`, `state${n}-h`, `state${n}-s`);
                }
                requiredCells.push('state1-x', 'state6-x');
                return requiredCells.every(cellId => {
                    const v = givenValues[cellId];
                    return v !== undefined && v !== null && v !== '';
                });
            };

            const isWorkHeatComplete = () => {
                return Object.keys(CORRECT_ENERGY_CATEGORIES).every(comp => !!workHeatPlacements[comp]);
            };

            const isWorkHeatCorrect = () => {
                return Object.keys(CORRECT_ENERGY_CATEGORIES).every(
                    comp => workHeatPlacements[comp] === CORRECT_ENERGY_CATEGORIES[comp]
                );
            };

            const handleWorkHeatDrop = (componentName, category) => {
                setWorkHeatPlacements(prev => ({ ...prev, [componentName]: category }));
                setErrorMessage('');
            };

            const startWhUnfold = () => {
                setWhMorphed(false);
                setWhShowFull(false);
                setIsWhUnfolding(true);
                const duration = 2000;
                const start = performance.now();
                const step = (now) => {
                    const raw = Math.min(1, (now - start) / duration);
                    setWhUnfoldT(raw);
                    if (raw < 1) {
                        requestAnimationFrame(step);
                    } else {
                        // Pause on the generic label, then reveal the full name, hold there,
                        // then slowly morph every pill to its abbreviation at the same time,
                        // then drop into the table.
                        setTimeout(() => {
                            setWhShowFull(true);
                            setTimeout(() => {
                                setWhMorphed(true);
                                setTimeout(() => {
                                    setIsWhUnfolding(false);
                                    setEnergyPlacements({ ...workHeatPlacements });
                                    advancePhase('energy-equations');
                                }, 1300);
                            }, 1700);
                        }, 700);
                    }
                };
                requestAnimationFrame(step);
            };

            // Click-to-build equation handlers (Energy Equations phase)
            const handleEqComponentClick = (name) => {
                setActiveEqComponent(name);
                setEqBuilderClicks([]);
            };

            const handleEqHClick = (stateNum) => {
                if (!activeEqComponent) return;
                if (eqBuilderClicks.length >= 2) return;
                const newClicks = [...eqBuilderClicks, stateNum];
                if (newClicks.length === 2) {
                    setEquationAttempts(prev => ({ ...prev, [activeEqComponent]: { before: newClicks[0], after: newClicks[1] } }));
                    setActiveEqComponent(null);
                    setEqBuilderClicks([]);
                } else {
                    setEqBuilderClicks(newClicks);
                }
            };

            const isAllEquationsAttempted = () => {
                return Object.keys(CORRECT_ENERGY_EQUATIONS).every(comp => !!equationAttempts[comp]);
            };

            const handleCheckEquations = () => {
                const result = {};
                Object.keys(CORRECT_ENERGY_EQUATIONS).forEach(comp => {
                    const attempt = equationAttempts[comp];
                    const correct = CORRECT_ENERGY_EQUATIONS[comp];
                    result[comp] = {
                        beforeCorrect: !!attempt && attempt.before === correct.before,
                        afterCorrect: !!attempt && attempt.after === correct.after,
                    };
                });
                setEqCheckResult(result);
                setEqRevealTier(0);
            };

            const isStateNumberingComplete = () => {
                return Object.keys(stateNumbering).length === 6;
            };
            
            const isStateNumberingCorrect = () => {
                // State 1 must be on arrow from CONDENSER to PUMP (arrow-6-1)
                if (stateNumbering['arrow-6-1'] !== 1) {
                    return false;
                }
                
                // Then check consecutive numbering following the flow
                const arrowOrder = ['arrow-6-1', 'arrow-1-2', 'arrow-2-3', 'arrow-3-4', 'arrow-4-5', 'arrow-5-6'];
                
                for (let i = 0; i < 6; i++) {
                    const expectedNumber = i + 1;
                    if (stateNumbering[arrowOrder[i]] !== expectedNumber) {
                        return false;
                    }
                }
                return true;
            };

            const isProcessTypeComplete = () => {
                return Object.keys(LEVEL_1.isoConnections).every(key => 
                    isoConnections.some(conn => conn.key === key)
                );
            };

            const isGivenValuesComplete = () => {
                return LEVEL_1.pinkCells.every(cell => pinkHighlights.includes(cell));
            };

            const isDerivableValuesComplete = () => {
                return LEVEL_1.blueCells.every(cell => blueHighlights.includes(cell));
            };

            // Pressing Enter advances past whichever "congratulations" modal is currently
            // showing, same as clicking its button - mirrors each modal's own condition and
            // action exactly, one per phase. No dependency array (runs after every render)
            // so these checks are never working off a stale closure; that's cheap here since
            // renders happen per user action, not per animation frame the way drag does.
            React.useEffect(() => {
                const handleEnterKey = (e) => {
                    if (e.key !== 'Enter') return;
                    if (phase === 'component-id' && isComponentIdComplete() && isComponentIdCorrect() && isStateNumberingComplete() && isStateNumberingCorrect() && !unfoldStarted) {
                        e.preventDefault();
                        setUnfoldStarted(true);
                    } else if (phase === 'given-values' && isGivenValuesComplete()) {
                        e.preventDefault();
                        advancePhase('iso-processes');
                    } else if (phase === 'iso-processes' && isoSubStep === 'connect' && isProcessTypeComplete()) {
                        e.preventDefault();
                        setIsoSubStep('derive');
                    } else if (phase === 'iso-processes' && isoSubStep === 'derive' && isDerivableValuesComplete()) {
                        e.preventDefault();
                        advancePhase('solve-states');
                    } else if (phase === 'solve-states' && isAllStatesSolved()) {
                        e.preventDefault();
                        advancePhase('work-heat-id', true);
                    } else if (phase === 'work-heat-id' && isWorkHeatComplete() && isWorkHeatCorrect() && !whUnfoldStarted) {
                        e.preventDefault();
                        setWhUnfoldStarted(true);
                    }
                };
                window.addEventListener('keydown', handleEnterKey);
                return () => window.removeEventListener('keydown', handleEnterKey);
            });

            const handleDragStart = (e, itemType, key) => {
                setDraggedItem({ type: itemType, key: key });
                e.dataTransfer.effectAllowed = 'move';
                e.dataTransfer.setData('text/plain', key); // Use standard type
                
                if ((phase === 'iso-processes' || phase === 'solve-states') && itemType === 'cell') {
                    setDragFromCell(key);
                    // Initialize mouse position at drag start
                    setMousePosition({ x: e.clientX, y: e.clientY });
                }
            };

            const handleDragOver = (e) => {
                e.preventDefault();
                e.dataTransfer.dropEffect = 'move';
            };

            const handleMouseEnter = (cellId) => {
                if ((phase === 'iso-processes' || phase === 'solve-states') && dragFromCell) {
                    setHoveredCell(cellId);
                }
            };

            const handleMouseLeave = () => {
                if (phase === 'iso-processes' || phase === 'solve-states') {
                    setHoveredCell(null);
                }
            };

            const handleDragEnd = () => {
                setHoveredCell(null);
                setDraggedItem(null); // Clear dragged item when drag ends
                setDragFromCell(null); // Clear drag source when drag ends
            };

            const handleDrop = (e, dropTarget) => {
                e.preventDefault();
                if (!draggedItem) return;

                // Component Identification Phase: Now handled via custom events in diagram
                // (No grid-based drops in this phase)

                // Component placement is now handled automatically by the unfold animation
                // (manual drag-to-table placement has been removed)

                // ISO Processes phase, connect sub-step: ISO connections
                if (phase === 'iso-processes' && isoSubStep === 'connect' && draggedItem.type === 'cell' && dragFromCell) {
                    const connectionKey = Object.keys(LEVEL_1.isoConnections).find(key => {
                        const conn = LEVEL_1.isoConnections[key];
                        return (conn.from === dragFromCell && conn.to === dropTarget) ||
                               (conn.from === dropTarget && conn.to === dragFromCell);
                    });

                    if (connectionKey) {
                        if (!isoConnections.some(c => c.key === connectionKey)) {
                            setIsoConnections([...isoConnections, {
                                key: connectionKey,
                                ...LEVEL_1.isoConnections[connectionKey]
                            }]);
                            setErrorMessage('');
                        }
                    } else {
                        setErrorMessage('Double check that! These cells aren\'t equal in any process.');
                        setTimeout(() => setErrorMessage(''), 2000);
                    }
                    setDragFromCell(null);
                    setHoveredCell(null);
                }

                // Given Values Phase: Pink highlighting
                // (Also handles the x1 pill dropped during solve-states, revealed via the
                // "Stuck?" modal — reuses the exact same mapping and drop mechanic as the
                // other given values rather than a separate code path.)
                const isX1StuckDrop = phase === 'solve-states' && draggedItem.key === 'x₁';
                if ((phase === 'given-values' || isX1StuckDrop) && draggedItem.type === 'given-value') {
                    // Map property names to cell IDs
                    const propertyToCellMap = {
                        'P₃': 'state3-P',
                        'T₃': 'state3-T',
                        'P₄': 'state4-P',
                        'T₅': 'state5-T',
                        'P₆': 'state6-P',
                        'x₁': 'state1-x'
                    };
                    
                    // Map property names to their display values
                    const propertyToValueMap = {
                        'P₃': '10 MPa',
                        'T₃': '600°C',
                        'P₄': '5 MPa',
                        'T₅': '500°C',
                        'P₆': '100000 Pa',
                        'x₁': '0'
                    };
                    
                    const correctCell = propertyToCellMap[draggedItem.key];
                    
                    if (dropTarget === correctCell) {
                        if (!pinkHighlights.includes(dropTarget)) {
                            setPinkHighlights([...pinkHighlights, dropTarget]);
                            setGivenValues({...givenValues, [dropTarget]: propertyToValueMap[draggedItem.key]});
                            setErrorMessage('');
                        }
                    } else {
                        setErrorMessage(`${draggedItem.key} doesn't go here. Try the correct cell for this property!`);
                        setTimeout(() => setErrorMessage(''), 2000);
                    }
                }

                // ISO Processes phase, derive sub-step: Blue highlighting via ISO connections
                if (phase === 'iso-processes' && isoSubStep === 'derive' && draggedItem.type === 'cell' && dragFromCell) {
                    // Check if source cell is pink (a given value)
                    if (!pinkHighlights.includes(dragFromCell)) {
                        setErrorMessage('You must drag FROM a pink (given value) cell!');
                        setTimeout(() => setErrorMessage(''), 2000);
                        setDragFromCell(null);
                        setHoveredCell(null);
                        return;
                    }
                    
                    // Check if there's an ISO connection between source and target
                    const connectionKey = Object.keys(LEVEL_1.isoConnections).find(key => {
                        const conn = LEVEL_1.isoConnections[key];
                        return (conn.from === dragFromCell && conn.to === dropTarget) ||
                               (conn.from === dropTarget && conn.to === dragFromCell);
                    });

                    if (!connectionKey) {
                        setErrorMessage('These cells aren\'t connected via an ISO process!');
                        setTimeout(() => setErrorMessage(''), 2000);
                        setDragFromCell(null);
                        setHoveredCell(null);
                        return;
                    }
                    
                    // Check if target is a valid blue cell
                    if (!LEVEL_1.blueCells.includes(dropTarget)) {
                        setErrorMessage('This cell can\'t be determined from given values + iso processes yet.');
                        setTimeout(() => setErrorMessage(''), 2000);
                        setDragFromCell(null);
                        setHoveredCell(null);
                        return;
                    }
                    
                    // All checks passed - add blue highlight
                    if (!blueHighlights.includes(dropTarget)) {
                        setBlueHighlights([...blueHighlights, dropTarget]);
                        // Copy the value from source (pink) cell to target (blue) cell
                        setGivenValues({...givenValues, [dropTarget]: givenValues[dragFromCell]});
                        setErrorMessage('');
                    }
                    
                    setDragFromCell(null);
                    setHoveredCell(null);
                }

                // Solve States Phase: Drag calculated values along ISO connections
                if (phase === 'solve-states' && draggedItem.type === 'cell' && dragFromCell) {
                    // Check if source cell has a value
                    if (!givenValues[dragFromCell]) {
                        setErrorMessage('Source cell must have a value!');
                        setTimeout(() => setErrorMessage(''), 2000);
                        setDragFromCell(null);
                        setHoveredCell(null);
                        return;
                    }
                    
                    // Check if there's an ISO connection between source and target
                    const connectionExists = isoConnections.some(conn => 
                        (conn.from === dragFromCell && conn.to === dropTarget) ||
                        (conn.from === dropTarget && conn.to === dragFromCell)
                    );

                    if (!connectionExists) {
                        setErrorMessage('These cells aren\'t connected via an ISO process!');
                        setTimeout(() => setErrorMessage(''), 2000);
                        setDragFromCell(null);
                        setHoveredCell(null);
                        return;
                    }
                    
                    // Check if target cell already has a value
                    if (givenValues[dropTarget]) {
                        setErrorMessage('Target cell already has a value!');
                        setTimeout(() => setErrorMessage(''), 2000);
                        setDragFromCell(null);
                        setHoveredCell(null);
                        return;
                    }
                    
                    // All checks passed - add blue highlight and copy value
                    if (!blueHighlights.includes(dropTarget)) {
                        setBlueHighlights([...blueHighlights, dropTarget]);
                    }
                    // Copy the value from source cell to target cell
                    setGivenValues({...givenValues, [dropTarget]: givenValues[dragFromCell]});
                    setErrorMessage('');
                    
                    setDragFromCell(null);
                    setHoveredCell(null);
                }
                
                setDraggedItem(null);
            };

            // Builds a single CoolProp code line (e.g. "T2 = PropsSI('T', 'P', P2, 'S', s2, 'Water')")
            // from a solve queue entry. Shared by the live in-progress preview and the
            // permanent solvedCodeLog, so the two always render identically.
            const buildCodeLine = (entry) => {
                const findParts = entry.find.split('-');
                const stateNum = findParts[0].replace('state', '');
                const findProp = findParts[1];
                const coolPropMap = { 'P': 'P', 'T': 'T', 'h': 'H', 's': 'S', 'x': 'Q' };
                const findCoolProp = coolPropMap[findProp];
                const findVarName = `${findProp}${stateNum}`;

                const using1 = entry.using[0].split('-')[1];
                const using1CoolProp = coolPropMap[using1];
                const using1VarName = `${using1}${stateNum}`;

                const using2 = entry.using[1].split('-')[1];
                const using2CoolProp = coolPropMap[using2];
                const using2VarName = `${using2}${stateNum}`;

                return `${findVarName} = PropsSI('${findCoolProp}', '${using1CoolProp}', ${using1VarName}, '${using2CoolProp}', ${using2VarName}, 'Water')`;
            };

            const getPhaseTitle = () => {
                if (phase === 'component-id') return 'Diagram Labelling';
                if (phase === 'given-values') return 'Given Values';
                if (phase === 'iso-processes') return isoSubStep === 'connect' ? 'ISO Processes' : 'Derivable Values';
                if (phase === 'solve-states') return 'Solve States';
                if (phase === 'work-heat-id') return 'Work & Heat Identification';
                if (phase === 'energy-equations') return 'Energy Equations';
                if (phase === 'energy-values') return 'Solve Energy Values';
                if (phase === 'cycle-performance') return 'Cycle Performance';
                return '';
            };

            const getPhaseInstructions = () => {
                if (phase === 'component-id') return 'Drag components and state numbers onto the diagram to label all parts of the cycle';
                if (phase === 'given-values') return 'Drag the given value boxes onto the cells that receive those values';
                if (phase === 'iso-processes') return isoSubStep === 'connect'
                    ? 'Drag FROM one cell TO another to show they\'re equal (e.g., s₁ → s₂ for isentropic pump)'
                    : 'Drag FROM pink cells TO connected cells via ISO processes to identify derivable values';
                if (phase === 'solve-states') return 'Click on a state header to select it. CoolProp needs exactly 2 known properties to find any other property at that state — click the property you want to Find first, then click the 2 properties you\'ll use to get it. You can queue up more than one property to find (reusing the same 2 known properties) before hitting Solve, to calculate several at once. Once a property is solved, you can also drag it across an ISO connection to fill the matching cell at the next state directly — no need to re-solve a value you already know.';
                if (phase === 'work-heat-id') return 'Drag each pill onto the component it describes. A pill can be used more than once.';
                if (phase === 'energy-equations') return hOnlyView ? 'Click a component to select it, then click its h-before state and its h-after state.' : 'To solve further, we only need enthalpy (h) at each state.';
                if (phase === 'cycle-performance') return 'Drag each energy term into the equation it belongs to. One term isn\'t needed for either.';
                return '';
            };

            // Available components for Component ID phase
            const availableComponentsForDiagram = phase === 'component-id' ? shuffledComponents.filter(
                comp => !Object.values(diagramPlacements).includes(comp)
            ) : [];

            // Preview connection for the ISO Processes phase (both sub-steps)
            const getPreviewConnection = () => {
                if (phase !== 'iso-processes' || !dragFromCell || !hoveredCell) return null;
                
                // Safety check: make sure LEVEL_1.isoConnections exists
                if (!LEVEL_1.isoConnections) return null;
                
                const connectionKey = Object.keys(LEVEL_1.isoConnections).find(key => {
                    const conn = LEVEL_1.isoConnections[key];
                    if (!conn) return false;
                    return (conn.from === dragFromCell && conn.to === hoveredCell) ||
                           (conn.from === hoveredCell && conn.to === dragFromCell);
                });
                
                if (connectionKey) {
                    // In the connect sub-step, only show if not already connected
                    // In the derive sub-step, always show if there's a valid connection
                    if (isoSubStep === 'connect' && isoConnections.some(c => c.key === connectionKey)) {
                        return null;
                    }
                    return { key: connectionKey, ...LEVEL_1.isoConnections[connectionKey] };
                }
                return null;
            };

            const previewConnection = getPreviewConnection();

            // Handler for clicking on state headers in solve-states phase
            const handleStateClick = (stateNum) => {
                if (phase === 'solve-states') {
                    setSelectedState(stateNum);
                    setClickedCells([]); // Clear clicked cells when switching states
                    setCurrentFind(null); // Clear current find property
                    setCurrentUsing([]); // Clear current using properties
                    setSolvingMode('finding'); // Reset to finding mode
                }
            };

            // Handler for clicking on cells in solve-states phase
            const handleCellClickForSolving = (cellId) => {
                if (phase === 'solve-states' && selectedState !== null) {
                    // Add to appropriate part of current queue entry based on mode
                    if (solvingMode === 'finding') {
                        // Prevent clicking if already being found
                        const isInQueue = solveQueue.some(entry => entry.find === cellId);
                        const isCurrentFind = currentFind === cellId;
                        if (isInQueue || isCurrentFind) {
                            return; // Already being found, do nothing
                        }
                        
                        // Set the current property to find
                        setCurrentFind(cellId);
                        // Auto-switch to using mode
                        setSolvingMode('using');
                    } else {
                        // Prevent adding same using property twice to current entry
                        if (currentUsing.includes(cellId)) {
                            return; // Already in current using list
                        }
                        
                        // Add to current using properties
                        const newUsing = [...currentUsing, cellId];
                        setCurrentUsing(newUsing);
                        
                        // If we now have 2 using properties, automatically finalize this entry
                        if (newUsing.length === 2) {
                            // Add to queue
                            setSolveQueue([...solveQueue, { find: currentFind, using: newUsing }]);
                            // Reset for next entry
                            setCurrentFind(null);
                            setCurrentUsing([]);
                            // Switch back to finding mode
                            setSolvingMode('finding');
                        }
                    }
                    
                    // Add cell to clicked cells list for tracking/debugging
                    setClickedCells([...clickedCells, cellId]);
                }
            };

            // Handler for clicking on phases in checklist
            const handlePhaseClick = (phaseId) => {
                // Allow clicking on completed phases only (not current phase)
                if (completedPhases.includes(phaseId) && phaseId !== phase) {
                    setPhase(phaseId);
                    setErrorMessage(''); // Clear any error messages when navigating
                    
                    // Determine which phases come after the clicked phase
                    const phaseOrder = ['component-id', 'given-values', 'iso-processes', 'solve-states', 'work-heat-id', 'energy-equations', 'energy-values', 'cycle-performance'];
                    const clickedIndex = phaseOrder.indexOf(phaseId);
                    
                    // Restore snapshots for phases BEFORE clicked phase, clear clicked phase and phases after
                    phaseOrder.forEach((p, index) => {
                        if (index < clickedIndex) {
                            // Restore from snapshot if available
                            if (completedPhaseData[p]) {
                                const snapshot = completedPhaseData[p];
                                switch(p) {
                                    case 'component-id':
                                        if (snapshot.diagramPlacements) setDiagramPlacements(snapshot.diagramPlacements);
                                        if (snapshot.stateNumbering) setStateNumbering(snapshot.stateNumbering);
                                        if (snapshot.componentPlacements) setComponentPlacements(snapshot.componentPlacements);
                                        break;
                                    case 'given-values':
                                        if (snapshot.pinkHighlights) setPinkHighlights(snapshot.pinkHighlights);
                                        if (snapshot.givenValues) setGivenValues(snapshot.givenValues);
                                        break;
                                    case 'iso-processes':
                                        if (snapshot.isoConnections) setIsoConnections(snapshot.isoConnections);
                                        if (snapshot.isoSubStep) setIsoSubStep(snapshot.isoSubStep);
                                        if (snapshot.blueHighlights) setBlueHighlights(snapshot.blueHighlights);
                                        if (snapshot.givenValues) setGivenValues(snapshot.givenValues);
                                        break;
                                    case 'work-heat-id':
                                        if (snapshot.workHeatPlacements) setWorkHeatPlacements(snapshot.workHeatPlacements);
                                        if (snapshot.energyPlacements) setEnergyPlacements(snapshot.energyPlacements);
                                        break;
                                    case 'energy-equations':
                                        if (snapshot.hOnlyView !== undefined) setHOnlyView(snapshot.hOnlyView);
                                        if (snapshot.equationAttempts) setEquationAttempts(snapshot.equationAttempts);
                                        break;
                                    case 'energy-values':
                                        if (snapshot.energyValueIndex !== undefined) setEnergyValueIndex(snapshot.energyValueIndex);
                                        if (snapshot.energyResults) setEnergyResults(snapshot.energyResults);
                                        break;
                                    case 'cycle-performance':
                                        if (snapshot.cyclePerfSlots) setCyclePerfSlots(snapshot.cyclePerfSlots);
                                        if (snapshot.cyclePerfStage !== undefined) setCyclePerfStage(snapshot.cyclePerfStage);
                                        if (snapshot.wNetValue !== undefined) setWNetValue(snapshot.wNetValue);
                                        if (snapshot.qTotalValue !== undefined) setQTotalValue(snapshot.qTotalValue);
                                        if (snapshot.etaValue !== undefined) setEtaValue(snapshot.etaValue);
                                        if (snapshot.cyclePerfHasChecked !== undefined) setCyclePerfHasChecked(snapshot.cyclePerfHasChecked);
                                        if (snapshot.cyclePerfRevealTier !== undefined) setCyclePerfRevealTier(snapshot.cyclePerfRevealTier);
                                        if (snapshot.cyclePerfEtaStep !== undefined) setCyclePerfEtaStep(snapshot.cyclePerfEtaStep);
                                        break;
                                }
                            }

                                            <span className="bg-green-100 border border-green-500 rounded px-2 py-0.5 text-green-900 font-semibold">X</span>{' '}
                                            <span className="font-semibold text-slate-700">and</span>{' '}
                                            <span className="bg-blue-100 border border-blue-500 rounded px-2 py-0.5 text-blue-900 font-semibold">this other known property</span>{' '}
                                            <span className="font-semibold text-slate-700">that we've named</span>{' '}
                                            <span className="bg-green-100 border border-green-500 rounded px-2 py-0.5 text-green-900 font-semibold">Y</span>{' '}
                                            <span className="font-semibold text-slate-700">assuming</span>{' '}

                                                <span className="font-bold text-slate-800">P</span> — Pressure
                                            </div>
                                            <div className="bg-white border border-slate-300 rounded px-2 py-1">
                                                <span className="font-bold text-slate-800">T</span> — Temperature
                                            </div>
                                            <div className="bg-white border border-slate-300 rounded px-2 py-1">
                                                <span className="font-bold text-slate-800">H</span> — Enthalpy (h)
                                            </div>
                                            <div className="bg-white border border-slate-300 rounded px-2 py-1">
                                                <span className="font-bold text-slate-800">S</span> — Entropy (s)
                                            </div>
                                            <div className="bg-white border border-slate-300 rounded px-2 py-1">

                                        <div className="bg-gray-900 text-green-400 p-3 rounded-lg font-mono text-sm">
                                            PropsSI(<span className="text-yellow-300">'Find'</span>, <span className="text-blue-300">'Prop1'</span>, value1, <span className="text-blue-300">'Prop2'</span>, value2, <span className="text-purple-300">'Water'</span>)
                                        </div>
                                        <ul className="text-sm text-slate-600 mt-2 list-disc list-inside space-y-1">

                                            <li><span className="font-semibold">Next 2 pairs</span> — the name and value of each property you're <span className="text-blue-700 font-semibold">using</span> (the two you already know at this state)</li>
                                            <li><span className="font-semibold">Last argument</span> — the working fluid (water, for this cycle)</li>
                                            <li>This comes from the <span className="italic">state postulate</span>: for a simple compressible substance, any 2 independent properties fully fix the state — so once you know 2, CoolProp can find the rest</li>
                                            <li>It doesn't matter which of your 2 known properties you list first — CoolProp reads them as a pair</li>
                                        </ul>
                                    </div>
                                </div>
                            )}
                        </div>
                    )}

                    {/* Solve States Interface - Display Above Table - Only shows when a state is selected */}
                    {phase === 'solve-states' && selectedState !== null && (
                        <div className="bg-white rounded-lg shadow-lg p-4 mb-6">
                            <h3 className="text-lg font-bold mb-2 text-gray-800">
                                Solving State {selectedState}
                            </h3>
                            
                            {/* Queue Display - Show all queued operations in one row */}
                            <div className="flex flex-wrap items-center justify-center gap-4 text-lg font-semibold text-gray-700">
                                {/* Show completed queue entries */}
                                {solveQueue.map((entry, queueIndex) => {
                                    const findParts = entry.find.split('-');
                                    const findProp = findParts[1];
                                    const stateNum = findParts[0].replace('state', '');
                                    const coolPropMap = { 'P': 'P', 'T': 'T', 'h': 'H', 's': 'S', 'x': 'Q' };
                                    const findCoolProp = coolPropMap[findProp];
                                    const findVarName = `${findProp}${stateNum}`;
                                    
                                    return (
                                        <React.Fragment key={queueIndex}>
                                            {queueIndex > 0 && <span className="text-gray-400 text-2xl">•</span>}
                                            <div className="flex items-center gap-2">
                                                <span>Find</span>
                                                <div className="bg-green-100 border-2 border-green-500 rounded px-3 py-1 text-center">
                                                    <div className="text-lg font-bold text-green-900">{findCoolProp}</div>
                                                    <div className="text-xs text-green-700">({findVarName})</div>
                                                </div>
                                                <span>using</span>
                                                {entry.using.map((usingId, usingIndex) => {
                                                    const usingParts = usingId.split('-');
                                                    const usingProp = usingParts[1];
                                                    const usingCoolProp = coolPropMap[usingProp];
                                                    const usingVarName = `${usingProp}${stateNum}`;
                                                    return (
                                                        <React.Fragment key={usingIndex}>
                                                            {usingIndex === entry.using.length - 1 && entry.using.length > 1 && (
                                                                <span className="text-gray-700">and</span>
                                                            )}
                                                            <div className="bg-blue-100 border-2 border-blue-500 rounded px-3 py-1 text-center">
                                                                <div className="text-lg font-bold text-blue-900">{usingCoolProp}</div>
                                                                <div className="text-xs text-blue-700">({usingVarName})</div>
                                                            </div>
                                                        </React.Fragment>
                                                    );
                                                })}
                                            </div>
                                        </React.Fragment>
                                    );
                                })}
                                
                                {/* Separator between queued and current - the current-builder row
                                    below is now always present (with placeholder blanks) once a
                                    state is selected, so this only needs to check for a queue. */}
                                {solveQueue.length > 0 && (
                                    <span className="text-gray-400 text-2xl">•</span>
                                )}
                                
                                {/* Current entry being built - always rendered (with placeholder
                                    blanks when nothing's been clicked yet) so this space is
                                    already reserved before the student clicks anything, rather
                                    than popping into existence and pushing the page down. */}
                                <div className="flex items-center gap-2 text-xl">
                                    <span>Find</span>
                                    {currentFind ? (() => {
                                        const parts = currentFind.split('-');
                                        const prop = parts[1];
                                        const stateNum = parts[0].replace('state', '');
                                        const coolPropMap = { 'P': 'P', 'T': 'T', 'h': 'H', 's': 'S', 'x': 'Q' };
                                        const coolPropProp = coolPropMap[prop];
                                        const varName = `${prop}${stateNum}`;
                                        return (
                                            <div className="bg-green-100 border-2 border-green-500 rounded px-3 py-1 text-center">
                                                <div className="text-lg font-bold text-green-900">{coolPropProp}</div>
                                                <div className="text-xs text-green-700">({varName})</div>
                                            </div>
                                        );
                                    })() : (
                                        <span className="text-gray-400 italic">___</span>
                                    )}
                                    <span>using</span>
                                    {currentUsing.length > 0 ? (
                                        currentUsing.map((cellId, index) => {
                                            const parts = cellId.split('-');
                                            const stateNum = parts[0].replace('state', '');
                                            const property = parts[1];
                                            const coolPropMap = { 'P': 'P', 'T': 'T', 'h': 'H', 's': 'S', 'x': 'Q' };
                                            const coolPropProperty = coolPropMap[property] || property;
                                            const variableName = `${property}${stateNum}`;
                                            return (
                                                <div key={index} className="inline-flex items-center gap-1">
                                                    {index === currentUsing.length - 1 && currentUsing.length > 1 && (
                                                        <span className="text-gray-700">and</span>
                                                    )}
                                                    <div className="bg-blue-100 border-2 border-blue-500 rounded px-3 py-1 text-center">
                                                        <div className="text-lg font-bold text-blue-900">{coolPropProperty}</div>
                                                        <div className="text-xs text-blue-700">({variableName})</div>
                                                    </div>
                                                </div>
                                            );
                                        })
                                    ) : (
                                        <>
                                            <span className="text-gray-400 italic">___</span>
                                            <span>and</span>
                                            <span className="text-gray-400 italic">___</span>
                                        </>
                                    )}
                                </div>
                            </div>
                            
                            {/* Live CoolProp Code Display - always present (rather than popping
                                in on first click) and collapsed to a fixed height by default
                                (header + first line), since this list only grows as more states
                                get solved across the whole system. */}
                            {(() => {
                                const queuedLines = solveQueue.map(buildCodeLine);

                                let currentPartialLine = null;
                                if (currentFind) {
                                    const parts = currentFind.split('-');
                                    const stateNum = parts[0].replace('state', '');
                                    const prop = parts[1];
                                    const coolPropMap = { 'P': 'P', 'T': 'T', 'h': 'H', 's': 'S', 'x': 'Q' };
                                    const coolPropProp = coolPropMap[prop];
                                    const varName = `${prop}${stateNum}`;

                                    let line = `${varName} = PropsSI('${coolPropProp}'`;
                                    if (currentUsing.length >= 1) {
                                        const using1 = currentUsing[0].split('-')[1];
                                        const coolPropUsing1 = coolPropMap[using1];
                                        const using1Var = `${using1}${stateNum}`;
                                        line += `, '${coolPropUsing1}', ${using1Var}`;

                                        if (currentUsing.length >= 2) {
                                            const using2 = currentUsing[1].split('-')[1];
                                            const coolPropUsing2 = coolPropMap[using2];
                                            const using2Var = `${using2}${stateNum}`;
                                            line += `, '${coolPropUsing2}', ${using2Var}, 'Water')`;
                                        } else {
                                            line += ',';
                                        }
                                    }
                                    currentPartialLine = line;
                                }

                                // Permanently-solved lines first, then this state's not-yet-solved
                                // queue, then whatever's currently being built - so the "first
                                // line" shown while collapsed is always the oldest solved line,
                                // and everything newer lives behind the dropdown.
                                const allLines = [
                                    ...solvedCodeLog,
                                    ...queuedLines,
                                    ...(currentPartialLine ? [currentPartialLine] : []),
                                ];
                                const hasMore = allLines.length > 1;
                                const visibleLines = codePreviewExpanded ? allLines : allLines.slice(0, 1);

                                return (
                                    <div className="mt-6 bg-gray-900 text-green-400 p-4 rounded-lg font-mono text-sm">
                                        <div className="flex items-center justify-between mb-2 flex-wrap gap-2">
                                            <div className="text-gray-400"># CoolProp Code:</div>
                                            <div className="flex items-center gap-3">
                                                <button
                                                    onClick={() => {
                                                        if (solvedCodeLog.length === 0) return;
                                                        navigator.clipboard.writeText(solvedCodeLog.join('\n'));
                                                        setShowCopyToast(true);
                                                        setTimeout(() => setShowCopyToast(false), 2000);
                                                    }}
                                                    disabled={solvedCodeLog.length === 0}
                                                    className={`text-xs font-sans font-semibold px-2 py-1 rounded transition ${
                                                        solvedCodeLog.length === 0
                                                            ? 'text-gray-600 cursor-not-allowed'
                                                            : 'text-gray-300 hover:text-white hover:bg-gray-700'
                                                    }`}
                                                >
                                                    📋 Copy all code
                                                </button>
                                                {hasMore && (
                                                    <button
                                                        onClick={() => setCodePreviewExpanded(!codePreviewExpanded)}
                                                        className="text-xs font-sans font-semibold text-gray-300 hover:text-white px-2 py-1 rounded hover:bg-gray-700 transition"
                                                    >
                                                        {codePreviewExpanded ? '▲ Hide' : `▼ Show ${allLines.length - 1} more line${allLines.length - 1 === 1 ? '' : 's'}`}
                                                    </button>
                                                )}
                                            </div>
                                        </div>
                                        {visibleLines.length > 0 ? (
                                            visibleLines.map((line, idx) => <div key={idx}>{line}</div>)
                                        ) : (
                                            <div className="text-gray-600 italic">(nothing solved yet)</div>
                                        )}
                                        {showCopyToast && (
                                            <div className="mt-2 text-xs font-sans text-green-300">✓ Copied to clipboard!</div>
                                        )}
                                    </div>
                                );
                            })()}
                        </div>
                    )}

                    {/* Solve States completion - lets the student move on once every state is fully solved */}
                    {phase === 'solve-states' && isAllStatesSolved() && (
                        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
                            <div className="bg-green-50 border-4 border-green-500 rounded-lg p-8 max-w-md mx-4 text-center shadow-2xl">
                                <h3 className="text-2xl font-bold text-green-700 mb-2">
                                    ✅ All 6 states solved!
                                </h3>
                                <p className="text-green-600 mb-4">
                                    Every property is known at every state. Next, let's identify where work and heat enter and leave the cycle.
                                </p>
                                <button
                                    onClick={() => advancePhase('work-heat-id', true)}
                                    className="bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-6 rounded-lg"
                                >
                                    Continue to Work &amp; Heat Identification →
                                </button>
                            </div>
                        </div>
                    )}

                    {/* Work & Heat Identification Phase */}
                    {phase === 'work-heat-id' && (
                        <>
                            {!whUnfoldStarted && (
                                <div className="flex gap-4 justify-center flex-wrap mb-4">
                                    {['Work In', 'Heat In', 'Work Out', 'Heat Out'].map((cat) => (
                                        <div
                                            key={cat}
                                            draggable
                                            onDragStart={(e) => e.dataTransfer.setData('text/plain', cat)}
                                            className="cursor-grab flex flex-col items-center"
                                        >
                                            <div className="bg-gray-100 border-2 border-gray-400 text-gray-800 font-semibold px-4 py-2 rounded-full">
                                                {ENERGY_CATEGORY_DISPLAY[cat]}
                                            </div>
                                            <div className="text-xs text-gray-500 mt-1 text-center max-w-[110px]">
                                                {ENERGY_CATEGORY_DESCRIPTIONS[cat]}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            )}

                            <RankineDiagram
                                componentPlacements={componentPlacements}
                                onDragStart={handleDragStart}
                                onDragEnd={handleDragEnd}
                                phase={phase}
                                componentIdPlacements={diagramPlacements}
                                stateNumbering={stateNumbering}
                                workHeatPlacements={workHeatPlacements}
                                onWorkHeatDrop={handleWorkHeatDrop}
                            />

                            {isWorkHeatComplete() && !isWorkHeatCorrect() && !whUnfoldStarted && (
                                <div className="bg-red-50 border-2 border-red-500 rounded-lg p-6 mb-6 text-center">
                                    <h3 className="text-xl font-bold text-red-700 mb-2">Not quite right!</h3>
                                    <p className="text-red-600">
                                        Some components have the wrong energy category. Drag a different pill onto them to change it.
                                    </p>
                                </div>
                            )}

                            {isWorkHeatComplete() && isWorkHeatCorrect() && !whUnfoldStarted && (
                                <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
                                    <div className="bg-green-50 border-4 border-green-500 rounded-lg p-8 max-w-md mx-4 text-center shadow-2xl">
                                        <h3 className="text-2xl font-bold text-green-700 mb-2">
                                            ✅ You've got the energy flow!
                                        </h3>
                                        <p className="text-green-600 mb-4">
                                            Work and heat are correctly identified at every component.
                                        </p>
                                        <button
                                            onClick={() => setWhUnfoldStarted(true)}
                                            className="bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-6 rounded-lg"
                                        >
                                            Continue →
                                        </button>
                                    </div>
                                </div>
                            )}

                            {whUnfoldStarted && (
                                <div className="bg-white rounded-lg shadow-lg p-6 mb-6 text-center">
                                    <h3 className="text-lg font-bold mb-1 text-gray-800">
                                        {whUnfoldT > 0 ? 'Unfolding into the table...' : 'Ready to send these down to the table'}
                                    </h3>
                                    <WorkHeatUnfoldAnimation t={whUnfoldT} workHeatPlacements={workHeatPlacements} showFull={whShowFull} morphed={whMorphed} />
                                    {!isWhUnfolding && whUnfoldT === 0 && (
                                        <button
                                            onClick={startWhUnfold}
                                            className="mt-2 bg-indigo-500 hover:bg-indigo-600 text-white font-bold py-3 px-6 rounded-lg"
                                        >
                                            Unfold into the table →
                                        </button>
                                    )}
                                </div>
                            )}
                        </>
                    )}

                    {/* Energy Equations Phase */}
                    {phase === 'energy-equations' && (
                        <div className="bg-white rounded-lg shadow-lg p-6 mb-6 text-center">
                            <h3 className="text-lg font-bold mb-2 text-gray-800">

                            </h3>
                            <p className="text-gray-600 mb-4">
                                Pressure, temperature, entropy, and quality did their job getting us here — from this point on, the energy balance only involves h. Let's simplify the table down to just that.
                            </p>
                            {!hOnlyView ? (
                                <button
                                    onClick={() => setHOnlyView(true)}
                                    className="bg-indigo-500 hover:bg-indigo-600 text-white font-bold py-3 px-6 rounded-lg"
                                >
                                    Show only enthalpy (h) →
                                </button>
                            ) : (
                                <button
                                    onClick={() => setHOnlyView(false)}
                                    className="bg-gray-500 hover:bg-gray-600 text-white font-bold py-3 px-6 rounded-lg"

                            {hOnlyView && isAllEquationsAttempted() && (
                                <div className="mt-6 pt-6 border-t border-gray-200">
