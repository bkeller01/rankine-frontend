<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#3b82f6">
    <link rel="manifest" href="manifest.json">
    <title>Rankine Cycle Practice - Level 1</title>
    <style>
        /* Improve mobile touch responsiveness for draggable elements */
        [draggable="true"] {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            touch-action: manipulation;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }
        
        /* Force opaque white background for state placeholders */
        .state-placeholder-bg {
            background-color: white !important;
        }

    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        // Progress checklist configuration
        const CHECKLIST_PHASES = [
            { id: 'component-id', label: 'Diagram Labelling', description: 'Label components and number states' },
            { id: 'given-values', label: 'Given Values', description: 'Highlight known properties' },
            { id: 'iso-processes', label: 'ISO Processes', description: 'Connect isentropic and isobaric processes, then derive values across them' },
            { id: 'solve-states', label: 'Solve States', description: 'Calculate all state properties' },
            { id: 'work-heat-id', label: 'Work & Heat', description: 'Identify energy flow directions' },
            { id: 'energy-equations', label: 'Energy Equations', description: 'Build the energy balance for each component' },
            { id: 'energy-values', label: 'Solve Energy Values', description: 'Rearrange and calculate each energy term' },
            { id: 'cycle-performance', label: 'Cycle Performance', description: 'Build w_net and q_total, then find thermal efficiency' },
        ];

        function ProgressChecklist({ currentPhase, completedPhases, onPhaseClick }) {
            const [mobileMenuOpen, setMobileMenuOpen] = React.useState(false);
            
            const getPhaseStatus = (phaseId) => {
                if (completedPhases.includes(phaseId)) return 'completed';
                if (phaseId === currentPhase) return 'current';
                return 'upcoming';
            };
            
            const getPhaseNumber = (phaseId) => {
                return CHECKLIST_PHASES.findIndex(p => p.id === phaseId) + 1;
            };

            return (
                <>
                    {/* Desktop: Horizontal Stepper - hidden on mobile, visible on medium+ screens */}
                    <div className="hidden md:block bg-white rounded-lg shadow-lg p-4 mb-6">
                        <div className="flex items-center justify-between gap-2">
                            {CHECKLIST_PHASES.map((phase, index) => {
                                const status = getPhaseStatus(phase.id);
                                const isClickable = status === 'completed';
                                const phaseNum = index + 1;
                                
                                return (
                                    <React.Fragment key={phase.id}>
                                        {/* Phase circle/box */}
                                        <div 
                                            className={`flex flex-col items-center ${isClickable ? 'cursor-pointer' : ''}`}
                                            onClick={isClickable ? () => onPhaseClick(phase.id) : undefined}
                                            title={isClickable ? `Click to view ${phase.label}` : phase.label}
                                        >
                                            {/* Circle with number or checkmark */}
                                            <div className={`
                                                w-10 h-10 rounded-full flex items-center justify-center font-bold text-sm mb-1
                                                ${status === 'completed' ? 'bg-green-500 text-white' : ''}
                                                ${status === 'current' ? 'bg-blue-600 text-white text-lg w-12 h-12 ring-4 ring-blue-300' : ''}
                                                ${status === 'upcoming' ? 'bg-gray-200 text-gray-500' : ''}
                                                ${status === 'completed' && isClickable ? 'hover:ring-2 hover:ring-green-300' : ''}
                                            `}>
                                                {status === 'completed' ? '✓' : phaseNum}
                                            </div>
                                            
                                            {/* Phase label */}
                                            <div className={`
                                                text-center text-xs max-w-[100px]
                                                ${status === 'completed' ? 'text-gray-500' : ''}
                                                ${status === 'current' ? 'text-blue-900 font-bold text-sm' : ''}
                                                ${status === 'upcoming' ? 'text-gray-400' : ''}
                                            `}>
                                                {phase.label}
                                            </div>
                                        </div>
                                        
                                        {/* Arrow connector (except after last item) */}
                                        {index < CHECKLIST_PHASES.length - 1 && (
                                            <div className={`
                                                flex-1 h-0.5 mx-1
                                                ${completedPhases.includes(CHECKLIST_PHASES[index + 1].id) || CHECKLIST_PHASES[index + 1].id === currentPhase ? 'bg-blue-400' : 'bg-gray-300'}
                                            `} />
                                        )}
                                    </React.Fragment>
                                );
                            })}
                        </div>
                    </div>
                    
                    {/* Mobile: Hamburger Menu - visible on mobile, hidden on medium+ screens */}
                    <div className="md:hidden mb-6">
                        {/* Hamburger Button */}
                        <button
                            onClick={() => setMobileMenuOpen(!mobileMenuOpen)}
                            className="w-full bg-white rounded-lg shadow-lg p-4 flex items-center justify-between"
                        >
                            <div className="flex items-center gap-3">
                                <span className="text-2xl">☰</span>
                                <div className="text-left">
                                    <div className="text-sm font-bold text-blue-900">
                                        Phase {getPhaseNumber(currentPhase)}: {CHECKLIST_PHASES.find(p => p.id === currentPhase)?.label}
                                    </div>
                                    <div className="text-xs text-gray-500">
                                        {completedPhases.length} of {CHECKLIST_PHASES.length} completed
                                    </div>
                                </div>
                            </div>
                            <span className={`text-gray-500 transition-transform ${mobileMenuOpen ? 'rotate-180' : ''}`}>
                                ▼
                            </span>
                        </button>
                        
                        {/* Mobile Drawer */}
                        {mobileMenuOpen && (
                            <div className="mt-2 bg-white rounded-lg shadow-lg p-4">
                                <div className="space-y-1">
                                    {CHECKLIST_PHASES.map((phase) => {
                                        const status = getPhaseStatus(phase.id);
                                        const isClickable = status === 'completed';
                                        
                                        let iconClass = "text-lg w-6";
                                        let textClass = "flex-1 text-sm";
                                        let containerClass = "flex items-center gap-2";
                                        
                                        if (status === 'completed') {
                                            iconClass += " text-green-600";
                                            textClass += " text-gray-500 line-through";
                                            containerClass += " cursor-pointer hover:bg-green-50 rounded px-2 py-1 -mx-2 -my-1 transition-colors";
                                        } else if (status === 'current') {
                                            iconClass += " text-blue-600";
                                            textClass += " text-blue-900 font-bold";
                                            containerClass += " bg-blue-200 rounded-lg px-3 py-2 -mx-2 -my-1 border-4 border-blue-500 shadow-lg";
                                        } else {
                                            iconClass += " text-gray-400";
                                            textClass += " text-gray-600";
                                        }
                                        
                                        return (
                                            <div 
                                                key={phase.id} 
                                                className={containerClass}
                                                onClick={() => {
                                                    if (isClickable) {
                                                        onPhaseClick(phase.id);
                                                        setMobileMenuOpen(false);
                                                    }
                                                }}
                                                title={isClickable ? `Click to view ${phase.label}` : ''}
                                            >
                                                <span className={iconClass}>
                                                    {status === 'completed' ? '✓' : status === 'current' ? '→' : '○'}
                                                </span>
                                                <span className={textClass}>
                                                    {phase.label}
                                                </span>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        )}
                    </div>
                </>
            );
        }

        // Rankine Cycle Diagram Component
        function RankineDiagram({ componentPlacements, onDragStart, onDragEnd, phase, componentIdPlacements, stateNumbering, workHeatPlacements, onWorkHeatDrop, startPointerDrag }) {
            const isPlaced = (component) => Object.values(componentPlacements).includes(component);
            
            // Helper for component-id phase
            const getPlacedComponent = (position) => {
                if (phase === 'component-id') {
                    return componentIdPlacements?.[position] || null;
                }
                return null;
            };
            
            // Helper to get placed state number for an arrow
            const getPlacedStateNumber = (arrowPosition) => {
                return stateNumbering?.[arrowPosition] || null;
            };
            
            return (
                <div className="bg-white rounded-lg shadow-lg p-1 mb-4">
                    <div className="h-[70vh] md:h-[51vh]">
                        <svg viewBox="110 95 540 255" className="w-full h-full">
                        {/* Define arrow marker */}
                        <defs>
                            <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                                <polygon points="0 0, 10 3.5, 0 7" fill="#374151" />
                            </marker>
                        </defs>
                        
                        {/* Flow arrows */}
                        {/* PUMP → BOILER (vertical up) */}
                        <line x1="170" y1="242" x2="170" y2="155" stroke="#374151" strokeWidth="2" markerEnd="url(#arrowhead)"/>
                        {/* BOILER → HP TURB */}
                        <line x1="210" y1="130" x2="280" y2="130" stroke="#374151" strokeWidth="2" markerEnd="url(#arrowhead)"/>
                        {/* HP TURB → REHEATER */}
                        <line x1="330" y1="130" x2="390" y2="130" stroke="#374151" strokeWidth="2" markerEnd="url(#arrowhead)"/>
                        {/* REHEATER → LP TURB */}
                        <line x1="470" y1="130" x2="530" y2="130" stroke="#374151" strokeWidth="2" markerEnd="url(#arrowhead)"/>
                        {/* LP TURB → CONDENSER (right then down, L-shape) */}
                        <line x1="580" y1="130" x2="610" y2="130" stroke="#374151" strokeWidth="2"/>
                        <line x1="610" y1="130" x2="610" y2="237" stroke="#374151" strokeWidth="2" markerEnd="url(#arrowhead)"/>
                        {/* CONDENSER → PUMP */}
                        <line x1="513" y1="272" x2="200" y2="272" stroke="#374151" strokeWidth="2" markerEnd="url(#arrowhead)"/>
                        
                        {/* State number indicators (visible in all phases) */}
                        {(phase === 'component-id' || phase === 'state-numbering' || phase === 'iso-processes' || phase === 'given-values' || phase === 'solve-states' || phase === 'work-heat-id') && (
                            <>
                                {/* Arrow 1-2: PUMP → BOILER */}
                                <rect x="154.5" y="183" width="30" height="30" fill="white" rx="15"/>
                                {(phase === 'state-numbering' || phase === 'component-id') ? (
                                    <rect x="154.5" y="183" width="30" height="30" fill="none" rx="15" stroke="#9ca3af" strokeWidth="2" strokeDasharray="4"/>
                                ) : (
                                    <rect x="154.5" y="183" width="30" height="30" fill="none" rx="15" stroke="#6366f1" strokeWidth="2"/>
                                )}
                                {/* Number text */}
                                <text x="169.5" y="203" textAnchor="middle" fontWeight="bold" fill="#4338ca" fontSize="14" pointerEvents="none">
                                    {getPlacedStateNumber('arrow-1-2') || ''}
                                </text>
                                {/* Invisible interaction rect for drag/drop */}
                                <foreignObject x="154.5" y="183" width="30" height="30">
                                    <div
                                        data-drop-type="state-number"
                                        data-drop-key="arrow-1-2"
                                        onPointerDown={phase === 'component-id' && getPlacedStateNumber('arrow-1-2') ? startPointerDrag('state-number', getPlacedStateNumber('arrow-1-2'), 'arrow-1-2') : undefined}
                                        style={{
                                            width: '100%', height: '100%', background: 'transparent',
                                            cursor: phase === 'component-id' && getPlacedStateNumber('arrow-1-2') ? 'grab' : 'default',
                                            touchAction: 'none', userSelect: 'none',
                                        }}
                                    />
                                </foreignObject>
                                
                                {/* Arrow 2-3: BOILER → HP TURB */}
                                <rect x="222" y="115" width="30" height="30" fill="white" rx="15"/>
                                {(phase === 'state-numbering' || phase === 'component-id') ? (
                                    <rect x="222" y="115" width="30" height="30" fill="none" rx="15" stroke="#9ca3af" strokeWidth="2" strokeDasharray="4"/>
                                ) : (
                                    <rect x="222" y="115" width="30" height="30" fill="none" rx="15" stroke="#6366f1" strokeWidth="2"/>
                                )}
                                <text x="237" y="135" textAnchor="middle" fontWeight="bold" fill="#4338ca" fontSize="14" pointerEvents="none">
                                    {getPlacedStateNumber('arrow-2-3') || ''}
                                </text>
                                <foreignObject x="222" y="115" width="30" height="30">
                                    <div
                                        data-drop-type="state-number"
                                        data-drop-key="arrow-2-3"
                                        onPointerDown={phase === 'component-id' && getPlacedStateNumber('arrow-2-3') ? startPointerDrag('state-number', getPlacedStateNumber('arrow-2-3'), 'arrow-2-3') : undefined}
                                        style={{
                                            width: '100%', height: '100%', background: 'transparent',
                                            cursor: phase === 'component-id' && getPlacedStateNumber('arrow-2-3') ? 'grab' : 'default',
                                            touchAction: 'none', userSelect: 'none',
                                        }}
                                    />
                                </foreignObject>
                                
                                {/* Arrow 3-4: HP TURB → REHEATER */}
                                <rect x="336" y="115" width="30" height="30" fill="white" rx="15"/>
                                {(phase === 'state-numbering' || phase === 'component-id') ? (
                                    <rect x="336" y="115" width="30" height="30" fill="none" rx="15" stroke="#9ca3af" strokeWidth="2" strokeDasharray="4"/>
                                ) : (
                                    <rect x="336" y="115" width="30" height="30" fill="none" rx="15" stroke="#6366f1" strokeWidth="2"/>
                                )}
                                <text x="351" y="135" textAnchor="middle" fontWeight="bold" fill="#4338ca" fontSize="14" pointerEvents="none">
                                    {getPlacedStateNumber('arrow-3-4') || ''}
                                </text>
                                <foreignObject x="336" y="115" width="30" height="30">
                                    <div
                                        data-drop-type="state-number"
                                        data-drop-key="arrow-3-4"
                                        onPointerDown={phase === 'component-id' && getPlacedStateNumber('arrow-3-4') ? startPointerDrag('state-number', getPlacedStateNumber('arrow-3-4'), 'arrow-3-4') : undefined}
                                        style={{
                                            width: '100%', height: '100%', background: 'transparent',
                                            cursor: phase === 'component-id' && getPlacedStateNumber('arrow-3-4') ? 'grab' : 'default',
                                            touchAction: 'none', userSelect: 'none',
                                        }}
                                    />
                                </foreignObject>
                                
                                {/* Arrow 4-5: REHEATER → LP TURB */}
                                <rect x="476" y="115" width="30" height="30" fill="white" rx="15"/>
                                {(phase === 'state-numbering' || phase === 'component-id') ? (
                                    <rect x="476" y="115" width="30" height="30" fill="none" rx="15" stroke="#9ca3af" strokeWidth="2" strokeDasharray="4"/>
                                ) : (
                                    <rect x="476" y="115" width="30" height="30" fill="none" rx="15" stroke="#6366f1" strokeWidth="2"/>
                                )}
                                <text x="491" y="135" textAnchor="middle" fontWeight="bold" fill="#4338ca" fontSize="14" pointerEvents="none">
                                    {getPlacedStateNumber('arrow-4-5') || ''}
                                </text>
                                <foreignObject x="476" y="115" width="30" height="30">
                                    <div
                                        data-drop-type="state-number"
                                        data-drop-key="arrow-4-5"
                                        onPointerDown={phase === 'component-id' && getPlacedStateNumber('arrow-4-5') ? startPointerDrag('state-number', getPlacedStateNumber('arrow-4-5'), 'arrow-4-5') : undefined}
                                        style={{
                                            width: '100%', height: '100%', background: 'transparent',
                                            cursor: phase === 'component-id' && getPlacedStateNumber('arrow-4-5') ? 'grab' : 'default',
                                            touchAction: 'none', userSelect: 'none',
                                        }}
                                    />
                                </foreignObject>
                                
                                {/* Arrow 5-6: LP TURB → CONDENSER */}
                                <rect x="595" y="178" width="30" height="30" fill="white" rx="15"/>
                                {(phase === 'state-numbering' || phase === 'component-id') ? (
                                    <rect x="595" y="178" width="30" height="30" fill="none" rx="15" stroke="#9ca3af" strokeWidth="2" strokeDasharray="4"/>
                                ) : (
                                    <rect x="595" y="178" width="30" height="30" fill="none" rx="15" stroke="#6366f1" strokeWidth="2"/>
                                )}
                                <text x="610" y="198" textAnchor="middle" fontWeight="bold" fill="#4338ca" fontSize="14" pointerEvents="none">
                                    {getPlacedStateNumber('arrow-5-6') || ''}
                                </text>
                                <foreignObject x="595" y="178" width="30" height="30">
                                    <div
                                        data-drop-type="state-number"
                                        data-drop-key="arrow-5-6"
                                        onPointerDown={phase === 'component-id' && getPlacedStateNumber('arrow-5-6') ? startPointerDrag('state-number', getPlacedStateNumber('arrow-5-6'), 'arrow-5-6') : undefined}
                                        style={{
                                            width: '100%', height: '100%', background: 'transparent',
                                            cursor: phase === 'component-id' && getPlacedStateNumber('arrow-5-6') ? 'grab' : 'default',
                                            touchAction: 'none', userSelect: 'none',
                                        }}
                                    />
                                </foreignObject>
                                
                                {/* Arrow 6-1: CONDENSER → PUMP */}
                                <rect x="346.5" y="257" width="30" height="30" fill="white" rx="15"/>
                                {(phase === 'state-numbering' || phase === 'component-id') ? (
                                    <rect x="346.5" y="257" width="30" height="30" fill="none" rx="15" stroke="#9ca3af" strokeWidth="2" strokeDasharray="4"/>
                                ) : (
                                    <rect x="346.5" y="257" width="30" height="30" fill="none" rx="15" stroke="#6366f1" strokeWidth="2"/>
                                )}
                                <text x="361.5" y="277" textAnchor="middle" fontWeight="bold" fill="#4338ca" fontSize="14" pointerEvents="none">
                                    {getPlacedStateNumber('arrow-6-1') || ''}
                                </text>
                                <foreignObject x="346.5" y="257" width="30" height="30">
                                    <div
                                        data-drop-type="state-number"
                                        data-drop-key="arrow-6-1"
                                        onPointerDown={phase === 'component-id' && getPlacedStateNumber('arrow-6-1') ? startPointerDrag('state-number', getPlacedStateNumber('arrow-6-1'), 'arrow-6-1') : undefined}
                                        style={{
                                            width: '100%', height: '100%', background: 'transparent',
                                            cursor: phase === 'component-id' && getPlacedStateNumber('arrow-6-1') ? 'grab' : 'default',
                                            touchAction: 'none', userSelect: 'none',
                                        }}
                                    />
                                </foreignObject>
                            </>
                        )}
                        
                        {/* PUMP (circle) - bottom left */}
                        <g>
                            <circle cx="170" cy="272" r="30" fill="#93c5fd" stroke="#1e40af" strokeWidth="3"/>
                            <text x="170" y="277" textAnchor="middle" fontSize="14" fontWeight="bold" fill="#1e3a8a" style={{pointerEvents: 'none'}}>PUMP</text>
                            {phase === 'component-id' ? (
                                <foreignObject x="147" y="256" width="45" height="30">
                                    <div
                                        data-drop-type="component"
                                        data-drop-key="pump"
                                        onPointerDown={getPlacedComponent('pump') ? startPointerDrag('component', getPlacedComponent('pump'), 'pump') : undefined}
                                        className="w-full h-full rounded-lg flex items-center justify-center text-center"
                                        style={{
                                            border: '2px dashed #9ca3af',
                                            backgroundColor: 'white',
                                            fontSize: '10px',
                                            fontWeight: 'bold',
                                            lineHeight: '1',
                                            paddingLeft: '2px',
                                            paddingRight: '2px',
                                            cursor: getPlacedComponent('pump') ? 'grab' : 'default',
                                            touchAction: 'none', userSelect: 'none',
                                        }}
                                    >
                                        {getPlacedComponent('pump') || ''}
                                    </div>
                                </foreignObject>
                            ) : (
                                !isPlaced('PUMP') && (
                                    <foreignObject x="147" y="256" width="45" height="30">
                                        <div
                                            draggable
                                            onDragStart={(e) => onDragStart(e, 'component', 'PUMP')}
                                            className="bg-blue-100 border-2 border-blue-400 rounded-lg py-1 cursor-move hover:bg-blue-200 transition text-center"
                                            style={{fontSize: '11px', fontWeight: 'bold', lineHeight: '1', paddingLeft: '6px', paddingRight: '6px'}}
                                        >
                                            PUMP
                                        </div>
                                    </foreignObject>
                                )
                            )}
                        </g>
                        
                        {/* BOILER (rectangle) - top left */}
                        <g>
                            <rect x="130" y="105" width="80" height="50" fill="#fca5a5" stroke="#b91c1c" strokeWidth="3"/>
                            <text x="170" y="135" textAnchor="middle" fontSize="14" fontWeight="bold" fill="#7f1d1d" style={{pointerEvents: 'none'}}>BOILER</text>
                            {phase === 'component-id' ? (
                                <foreignObject x="135" y="114" width="70" height="30">
                                    <div
                                        data-drop-type="component"
                                        data-drop-key="boiler"
                                        onPointerDown={getPlacedComponent('boiler') ? startPointerDrag('component', getPlacedComponent('boiler'), 'boiler') : undefined}
                                        className="w-full h-full rounded-lg flex items-center justify-center text-center"
                                        style={{
                                            border: '2px dashed #9ca3af',
                                            backgroundColor: 'white',
                                            fontSize: '10px',
                                            fontWeight: 'bold',
                                            lineHeight: '1',
                                            cursor: getPlacedComponent('boiler') ? 'grab' : 'default',
                                            touchAction: 'none', userSelect: 'none',
                                        }}
                                    >
                                        {getPlacedComponent('boiler') || ''}
                                    </div>
                                </foreignObject>
                            ) : (
                                !isPlaced('BOILER') && (
                                    <foreignObject x="135" y="114" width="70" height="30">
                                        <div
                                            draggable
                                            onDragStart={(e) => onDragStart(e, 'component', 'BOILER')}
                                            className="bg-red-100 border-2 border-red-400 rounded-lg px-2 py-1 cursor-move hover:bg-red-200 transition text-center"
                                            style={{fontSize: '11px', fontWeight: 'bold', lineHeight: '1'}}
                                        >
                                            BOILER
                                        </div>
                                    </foreignObject>
                                )
                            )}
                        </g>
                        
                        {/* HP TURB (trapezoid) - top center-left */}
                        <g>
                            <polygon points="280,115 330,105 330,155 280,145" fill="#86efac" stroke="#15803d" strokeWidth="2"/>
                            <text x="306" y="127" textAnchor="middle" fontSize="12" fontWeight="bold" fill="#14532d" style={{pointerEvents: 'none'}}>HP</text>
                            <text x="306" y="140" textAnchor="middle" fontSize="12" fontWeight="bold" fill="#14532d" style={{pointerEvents: 'none'}}>TURB</text>
                            {phase === 'component-id' ? (
                                <foreignObject x="284" y="114" width="45" height="30">
                                    <div
                                        data-drop-type="component"
                                        data-drop-key="hp-turb"
                                        onPointerDown={getPlacedComponent('hp-turb') ? startPointerDrag('component', getPlacedComponent('hp-turb'), 'hp-turb') : undefined}
                                        className="w-full h-full rounded-lg flex items-center justify-center text-center"
                                        style={{
                                            border: '2px dashed #9ca3af',
                                            backgroundColor: 'white',
                                            fontSize: '8px',
                                            fontWeight: 'bold',
                                            lineHeight: '1',
                                            cursor: getPlacedComponent('hp-turb') ? 'grab' : 'default',
                                            touchAction: 'none', userSelect: 'none',
                                        }}
                                    >
                                        {getPlacedComponent('hp-turb') || ''}
                                    </div>
                                </foreignObject>
                            ) : (
                                !isPlaced('HP TURB') && (
                                    <foreignObject x="284" y="114" width="45" height="30">
                                        <div
                                            draggable
                                            onDragStart={(e) => onDragStart(e, 'component', 'HP TURB')}
                                            className="bg-green-100 border-2 border-green-400 rounded-lg px-2 py-1 cursor-move hover:bg-green-200 transition text-center"
                                            style={{fontSize: '10px', fontWeight: 'bold', lineHeight: '1'}}
                                        >
                                            HP TURB
                                        </div>
                                    </foreignObject>
                                )
                            )}
                        </g>
                        
                        {/* REHEATER (rectangle) - top center */}
                        <g>

                        {/* LP TURB (trapezoid) - top right */}

                        {/* CONDENSER (ellipse) - right side */}
                        <g>

                        {phase === 'work-heat-id' && Object.keys(ENERGY_COMPONENT_POSITIONS).map((name) => {
                            const { cx, cy } = ENERGY_COMPONENT_POSITIONS[name];
                            const cat = workHeatPlacements[name];

                    </svg>

        }

        // Animates the six components flying from their loop positions in RankineDiagram
        // down into a row matching the real table slots. The connecting lines stretch along
        // with the shapes instead of fading, and the final wrap-around line becomes a dashed
        // arc under the row that stays in place as a reminder that the table is still the loop.
        function UnfoldAnimation({ t }) {
            const comps = [
                { key: 'pump', label: 'PUMP', shape: 'circle', cx: 170, cy: 272, rowX: 30, fill: '#93c5fd', stroke: '#1e40af' },
                { key: 'boiler', label: 'BOILER', shape: 'rect', cx: 170, cy: 130, rowX: 180, fill: '#fca5a5', stroke: '#b91c1c' },
                { key: 'hpturb', label: 'HP TURB', shape: 'trapezoid', cx: 305, cy: 130, rowX: 330, fill: '#86efac', stroke: '#15803d' },
                { key: 'reheater', label: 'REHEATER', shape: 'rect', cx: 430, cy: 130, rowX: 480, fill: '#fca5a5', stroke: '#b91c1c' },
                { key: 'lpturb', label: 'LP TURB', shape: 'trapezoid', cx: 555, cy: 130, rowX: 630, fill: '#86efac', stroke: '#15803d' },
                { key: 'condenser', label: 'CONDENSER', shape: 'ellipse', cx: 573, cy: 272, rowX: 780, fill: '#a5b4fc', stroke: '#3730a3' },
            ];
            const rowY = 420;
            const arcMidX = 405;
            const ease = (x) => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
            // Vertical motion uses an overshoot-then-settle curve so components appear to
            // drop slightly past the table row and click back up into place, like a plug seating.
            const easeY = (x) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
            // Three stages within t (0 to 1): move into position, hold/hover, then crossfade into the table-slot look
            const moveWindow = 0.5;   // fraction of the animation spent physically moving
            const holdEnd = 0.78;     // hover ends here; crossfade plays over the remainder
            const moveT = Math.min(1, t / moveWindow);
            const etX = ease(moveT);
            const etY = easeY(moveT);
            const crossfadeT = Math.max(0, Math.min(1, (t - holdEnd) / (1 - holdEnd)));
            // A quick stroke-width pulse right as the pill forms, like a click/snap into the slot
            const clickPulse = crossfadeT > 0 && crossfadeT < 0.4 ? Math.sin(Math.PI * (crossfadeT / 0.4)) : 0;
            const pillStroke = 2 + clickPulse * 3;

            const pos = comps.map(c => ({
                x: c.cx + (c.rowX - c.cx) * etX,
                y: c.cy + (rowY - c.cy) * etY
            }));

            const edges = comps.map((c, i) => {
                const a = pos[i], b = pos[(i + 1) % 6];
                let cx, cy, opacity;
                if (i === 5) {
                    const loopCx = (comps[5].cx + comps[0].cx) / 2, loopCy = (comps[5].cy + comps[0].cy) / 2;
                    cx = loopCx + (arcMidX - loopCx) * etX;
                    cy = loopCy + (560 - loopCy) * etY;
                    opacity = 1;
                } else {
                    const loopCx = (comps[i].cx + comps[i + 1].cx) / 2, loopCy = (comps[i].cy + comps[i + 1].cy) / 2;
                    cx = loopCx + ((a.x + b.x) / 2 - loopCx) * etX;
                    cy = loopCy + ((a.y + b.y) / 2 - 15 - loopCy) * etY;
                    opacity = 1 - crossfadeT;
                }
                return { d: `M ${a.x} ${a.y} Q ${cx} ${cy} ${b.x} ${b.y}`, opacity, dashed: i === 5 };
            });

            return (
                <svg viewBox="-20 50 840 480" className="w-full mx-auto" style={{ maxHeight: '400px', display: 'block' }}>
                    {edges.map((e, i) => (
                        <path key={i} d={e.d} fill="none" stroke="#374151" strokeWidth={e.dashed ? 1.5 : 2}
                              strokeDasharray={e.dashed ? '5 5' : undefined} opacity={e.opacity} />
                    ))}
                    {comps.map((c, i) => {
                        const dx = pos[i].x - c.cx;
                        const dy = pos[i].y - c.cy;
                        const shapeOpacity = 1 - crossfadeT;
                        const slotOpacity = crossfadeT;
                        return (
                            <g key={c.key}>
                                <g transform={`translate(${dx},${dy})`} opacity={shapeOpacity}>
                                    {c.shape === 'circle' && <circle cx={c.cx} cy={c.cy} r="37" fill={c.fill} stroke={c.stroke} strokeWidth="3"/>}
                                    {c.shape === 'rect' && <rect x={c.cx - 48} y={c.cy - 30} width="96" height="60" fill={c.fill} stroke={c.stroke} strokeWidth="3"/>}
                                    {c.shape === 'ellipse' && <ellipse cx={c.cx} cy={c.cy} rx="72" ry="48" fill={c.fill} stroke={c.stroke} strokeWidth="3"/>}
                                    {c.shape === 'trapezoid' && <polygon points={`${c.cx-30},${c.cy-18} ${c.cx+30},${c.cy-30} ${c.cx+30},${c.cy+30} ${c.cx-30},${c.cy+18}`} fill={c.fill} stroke={c.stroke} strokeWidth="2"/>}
                                    <text x={c.cx} y={c.cy + 5} textAnchor="middle" fontSize="14" fontWeight="bold" fill="#111">{c.label}</text>
                                </g>
                                <g transform={`translate(${pos[i].x},${pos[i].y})`} opacity={slotOpacity}>
                                    <rect x="-55" y="-22" width="110" height="44" rx="10" fill={c.fill} stroke={c.stroke} strokeWidth={pillStroke}/>
                                    <text x="0" y="6" textAnchor="middle" fontSize="14" fontWeight="bold" fill="#000">{c.label}</text>
                                </g>
                            </g>
                        );
                    })}
                    <text x={arcMidX} y="508" textAnchor="middle" fontSize="13" fill="#6b7280" opacity={crossfadeT}>cycle repeats</text>
                </svg>
            );
        }

        // Correct energy-flow category for each component: 1 Work In, 2 Heat In, 2 Work Out, 1 Heat Out
        const CORRECT_ENERGY_CATEGORIES = {
            'PUMP': 'Work In',
            'BOILER': 'Heat In',
            'HP TURB': 'Work Out',
            'REHEATER': 'Heat In',
            'LP TURB': 'Work Out',
            'CONDENSER': 'Heat Out',
        };
        // The correct h_before/h_after pair for each component's energy balance equation
        const CORRECT_ENERGY_EQUATIONS = {
            'PUMP': { before: 1, after: 2 },
            'BOILER': { before: 2, after: 3 },
            'HP TURB': { before: 3, after: 4 },
            'REHEATER': { before: 4, after: 5 },
            'LP TURB': { before: 5, after: 6 },
            'CONDENSER': { before: 6, after: 1 },
        };
        const ENERGY_COMPONENT_ORDER = ['PUMP', 'BOILER', 'HP TURB', 'REHEATER', 'LP TURB', 'CONDENSER'];
        // Extracts the leading number from a formatted value string like "3625.40 kJ/kg"
        const parseHValue = (str) => {
            if (!str) return null;
            const match = String(str).match(/-?[\d.]+/);
            return match ? parseFloat(match[0]) : null;
        };
        // Tag colors intentionally match each category's component color on the diagram
        // (Work In = Pump blue, Heat In = Boiler/Reheater red, Work Out = turbine green, Heat Out = Condenser indigo)
        // so that identification is reinforced once placed, without ever being visible on the pill tray beforehand.
        const ENERGY_CATEGORY_COLORS = {
            'Work In': { bg: '#dbeafe', border: '#1e40af', text: '#1e3a8a' },
            'Heat In': { bg: '#fee2e2', border: '#b91c1c', text: '#7f1d1d' },
            'Work Out': { bg: '#dcfce7', border: '#15803d', text: '#14532d' },
            'Heat Out': { bg: '#e0e7ff', border: '#3730a3', text: '#1e1b4b' },
        };
        // Display label shown on pills/tags/badges. The underlying category key (e.g. 'Work In')
        // stays the same everywhere internally (correctness checks, dataTransfer payload) —
        // only what's shown to the student changes.
        // Lowercase w/q here too, not just on the final calculated w_p/q_B/etc: this generic
        // symbol morphs directly into the specific one later in the same animation, and it's
        // already a specific (per-unit-mass) quantity from the moment it exists conceptually -
        // nothing about specific-vs-total changes between "this is a Work In interaction" and
        // "here's its calculated value."
        const ENERGY_CATEGORY_DISPLAY = {
            'Work In': '+w',
            'Heat In': '+q',
            'Work Out': '\u2212w',
            'Heat Out': '\u2212q',
        };
        const ENERGY_CATEGORY_DESCRIPTIONS = {
            'Work In': 'Work enters the system.',
            'Heat In': 'Heat enters the system.',
            'Work Out': 'Work leaves the system.',
            'Heat Out': 'Heat leaves the system.',
        };
        // Full and abbreviated forms of each component's energy term (sign comes from its category).
        // Lowercase w/q throughout - these are specific work/heat (per unit mass flow rate),
        // since every term here comes from a difference in specific enthalpy (h_after - h_before).
        // Uppercase W/Q conventionally denotes total (not per-unit-mass) work/heat.
        const ENERGY_FULL_NAME = {
            'PUMP': 'w_pump',
            'BOILER': 'q_boiler',
            'HP TURB': 'w_hpturbine',
            'REHEATER': 'q_reheater',
            'LP TURB': 'w_lpturbine',
            'CONDENSER': 'q_condenser',
        };
        const ENERGY_ABBREV_NAME = {
            'PUMP': 'w_p',
            'BOILER': 'q_B',
            'HP TURB': 'w_HP',
            'REHEATER': 'q_R',
            'LP TURB': 'w_LP',
            'CONDENSER': 'q_C',
        };
        const ENERGY_COMPONENT_POSITIONS = {
            'PUMP': { cx: 170, cy: 272 },
            'BOILER': { cx: 170, cy: 130 },
            'HP TURB': { cx: 305, cy: 130 },
            'REHEATER': { cx: 430, cy: 130 },
            'LP TURB': { cx: 555, cy: 130 },
            'CONDENSER': { cx: 573, cy: 272 },
        };
        // Which of the six solved energy terms feed w_net vs q_total in the Cycle Performance
        // phase. CONDENSER (q_C, heat rejected) deliberately maps to null - it's real energy-
        // balance information but isn't part of either required performance parameter, and is
        // left as a distractor the student must recognize doesn't belong in either equation.
        const CYCLE_PERF_MEMBERSHIP = {
            'PUMP': 'wnet',
            'HP TURB': 'wnet',
            'LP TURB': 'wnet',
            'BOILER': 'qtotal',
            'REHEATER': 'qtotal',
            'CONDENSER': null,
        };
        // Sign each component's term takes on within its equation. This is fully determined by
        // the category already established in Work & Heat (phase 6) - Work In and Heat Out are
        // negative, Work Out and Heat In are positive - so it's shown, not re-tested here.
        const CYCLE_PERF_SIGN = {
            'Work In': '\u2212',
            'Heat In': '+',
            'Work Out': '+',
            'Heat Out': '\u2212',
        };

        // Animates the six energy-category tags flying from their positions on the loop
        // diagram down into a new row in the table, reusing the same move/hover/crossfade/bounce
        // treatment as UnfoldAnimation for visual consistency.
        // Lets the student drag the known term(s) across the equals sign to isolate the energy
        // variable, then reveals the real computed value. "Plus" categories (Work In / Heat In)
        // need one drag; "minus" categories (Work Out / Heat Out) need two, since the unknown
        // starts trapped between a minus sign and a known term.
        function EnergyRearrange({ comp, eq, sign, abbrev, hBeforeVal, hAfterVal, onComplete }) {
            const isPlus = sign === '+';
            const maxStage = isPlus ? 1 : 2;
            const [stage, setStage] = useState(0);
            const [dragDx, setDragDx] = useState(0);
            const draggingRef = React.useRef(false);
            const startXRef = React.useRef(0);
            const dxRef = React.useRef(0);
            const cleanupRef = React.useRef(null);
            const THRESHOLD = 60;

            // Drag tracking lives on `window`, not on the tile itself. Tracking it locally
            // (via onPointerMove/onPointerUp on the small tile element) is fragile: once the
            // pointer travels far enough to pass over a sibling tile, the browser can quietly
            // reinterpret the gesture as a text-selection drag or trackpad pan and simply stop
            // delivering move/up events to the original element - which looks exactly like a
            // drag that "gets stuck" and won't even release. Listening on window sidesteps that
            // entirely: it doesn't matter what's visually underneath the pointer.
            React.useEffect(() => {
                return () => { if (cleanupRef.current) cleanupRef.current(); };
            }, []);

            const handleDown = (dir) => (e) => {
                e.preventDefault();
                draggingRef.current = true;
                startXRef.current = e.clientX;

                const onMove = (ev) => {
                    if (!draggingRef.current) return;
                    const dx = ev.clientX - startXRef.current;
                    const clamped = dir === 'right' ? Math.max(0, dx) : Math.min(0, dx);
                    dxRef.current = clamped;
                    setDragDx(clamped);
                };
                const onUp = () => {
                    if (!draggingRef.current) return;
                    draggingRef.current = false;
                    const passed = dir === 'right' ? dxRef.current > THRESHOLD : dxRef.current < -THRESHOLD;
                    dxRef.current = 0;
                    setDragDx(0);
                    if (passed) setStage(s => s + 1);
                    window.removeEventListener('pointermove', onMove);
                    window.removeEventListener('pointerup', onUp);
                    window.removeEventListener('pointercancel', onUp);
                    cleanupRef.current = null;
                };

                window.addEventListener('pointermove', onMove);
                window.addEventListener('pointerup', onUp);
                window.addEventListener('pointercancel', onUp);
                cleanupRef.current = () => {
                    window.removeEventListener('pointermove', onMove);
                    window.removeEventListener('pointerup', onUp);
                    window.removeEventListener('pointercancel', onUp);
                };
            };

            const Tile = ({ children, draggable, dir, accent }) => (
                <div
                    onPointerDown={draggable ? handleDown(dir) : undefined}
                    style={{
                        display: 'inline-block',
                        padding: '8px 14px',
                        borderRadius: '8px',
                        background: accent ? '#dbeafe' : '#f3f4f6',
                        border: accent ? '2px solid #1e40af' : '2px solid #9ca3af',
                        color: accent ? '#1e3a8a' : '#1f2937',
                        cursor: draggable ? 'grab' : 'default',
                        transform: draggable ? `translateX(${dragDx}px)` : undefined,
                        userSelect: 'none',
                        touchAction: draggable ? 'none' : undefined,
                    }}
                >
                    {children}
                </div>
            );
            const Line = () => <div style={{ width: 2, height: 36, background: '#9ca3af' }} />;

            let content;
            let hint;
            if (!isPlus && stage === 0) {
                content = (
                    <div className="flex items-center justify-center gap-2 text-xl font-semibold">
                        <Tile>h{eq.before}</Tile><span>&minus;</span>
                        <Tile draggable dir="right" accent>{abbrev}</Tile>
                        <Line />
                        <Tile>h{eq.after}</Tile>
                    </div>
                );
                hint = `Drag ${abbrev} across the line`;
            } else if (!isPlus && stage === 1) {
                content = (
                    <div className="flex items-center justify-center gap-2 text-xl font-semibold">
                        <Tile>h{eq.before}</Tile>
                        <Line />
                        <Tile draggable dir="left">h{eq.after}</Tile><span>+</span>
                        <Tile accent>{abbrev}</Tile>
                    </div>
                );
                hint = `Now drag h${eq.after} across the line to join it with h${eq.before}`;
            } else if (isPlus && stage === 0) {
                content = (
                    <div className="flex items-center justify-center gap-2 text-xl font-semibold">
                        <Tile draggable dir="right">h{eq.before}</Tile><span>+</span>
                        <Tile accent>{abbrev}</Tile>
                        <Line />
                        <Tile>h{eq.after}</Tile>
                    </div>
                );
                hint = `Drag h${eq.before} across the line`;
            } else if (isPlus) {
                content = (
                    <div className="flex items-center justify-center gap-2 text-xl font-semibold">
                        <Tile accent>{abbrev}</Tile>
                        <Line />
                        <Tile>h{eq.after}</Tile><span>&minus;</span>
                        <Tile>h{eq.before}</Tile>
                    </div>
                );
                hint = `Isolated: ${abbrev} = h${eq.after} \u2212 h${eq.before}`;
            } else {
                content = (
                    <div className="flex items-center justify-center gap-2 text-xl font-semibold">
                        <Tile accent>{abbrev}</Tile>
                        <Line />
                        <Tile>h{eq.before}</Tile><span>&minus;</span>
                        <Tile>h{eq.after}</Tile>
                    </div>
                );
                hint = `Isolated: ${abbrev} = h${eq.before} \u2212 h${eq.after}`;
            }

            const isIsolated = stage === maxStage;
            const result = isPlus ? (hAfterVal - hBeforeVal) : (hBeforeVal - hAfterVal);

            return (
                <div>
                    {content}
                    <p className="text-gray-500 text-sm mt-3">{hint}</p>
                    {isIsolated && (
                        <button
                            onClick={() => onComplete(comp, result.toFixed(1))}
                            className="mt-4 bg-indigo-500 hover:bg-indigo-600 text-white font-bold py-2 px-4 rounded-lg"
                        >
                            Plug in the numbers
                        </button>
                    )}
                </div>
            );
        }

        // Cycle Performance phase: drag the six known energy terms directly into the blank
        // slots of the w_net and q_total equations. Signs come from each term's already-
        // established Work & Heat category (not re-tested here) - the genuine new judgment
        // is which equation (if either) each term belongs in. CONDENSER never has a home.
        function CyclePerformanceBuilder({ energyPlacements, slots, setSlots, checked, revealTier }) {
            const [draggingComp, setDraggingComp] = React.useState(null);
            const [dragPos, setDragPos] = React.useState({ dx: 0, dy: 0 });
            const startRef = React.useRef({ x: 0, y: 0 });

            const placedComponents = [...slots.wnet, ...slots.qtotal].filter(Boolean);
            const trayComponents = ENERGY_COMPONENT_ORDER.filter(c => !placedComponents.includes(c));

            const isSlotCorrect = (group, idx) => {
                const comp = slots[group][idx];
                return comp !== null && CYCLE_PERF_MEMBERSHIP[comp] === group;
            };
            const groupCorrect = {
                wnet: slots.wnet.every((c, i) => isSlotCorrect('wnet', i)),
                qtotal: slots.qtotal.every((c, i) => isSlotCorrect('qtotal', i)),
            };

            const handlePointerDown = (comp) => (e) => {
                e.preventDefault();
                setDraggingComp(comp);
                startRef.current = { x: e.clientX, y: e.clientY };

                const onMove = (ev) => {
                    setDragPos({ dx: ev.clientX - startRef.current.x, dy: ev.clientY - startRef.current.y });

                const onUp = (ev) => {
                    window.removeEventListener('pointermove', onMove);
                    window.removeEventListener('pointerup', onUp);
                    window.removeEventListener('pointercancel', onUp);
                    const dropEl = document.elementFromPoint(ev.clientX, ev.clientY);
                    const slotEl = dropEl ? dropEl.closest('[data-slot-group]') : null;
                    setSlots(prev => {
                        // Remove comp from wherever it currently sits before placing it anew -
                        // if it lands back in the tray (no slot under the pointer), that's just
                        // "not placed", not an error state.
                        const next = {
                            wnet: prev.wnet.map(c => c === comp ? null : c),
                            qtotal: prev.qtotal.map(c => c === comp ? null : c),
                        };
                        if (slotEl) {
                            const group = slotEl.dataset.slotGroup;
                            const idx = parseInt(slotEl.dataset.slotIndex, 10);
                            // Whatever was previously in this slot simply becomes unplaced
                            // (back in the tray) since it's no longer referenced anywhere.
                            next[group][idx] = comp;
                        }
                        return next;
                    });
                    setDraggingComp(null);
                    setDragPos({ dx: 0, dy: 0 });
                };

                window.addEventListener('pointerup', onUp);
                window.addEventListener('pointercancel', onUp);
            };

            const Tile = ({ comp }) => {
                const cat = energyPlacements[comp];
                const sign = CYCLE_PERF_SIGN[cat] || '';
                const abbrev = ENERGY_ABBREV_NAME[comp];
                const colors = ENERGY_CATEGORY_COLORS[cat] || {};
                const isDragging = draggingComp === comp;
                return (
                    <div
                        onPointerDown={handlePointerDown(comp)}
                        style={{
                            display: 'inline-block',
                            padding: '8px 14px',
                            borderRadius: '8px',

                            border: `2px solid ${colors.border || '#9ca3af'}`,

                            touchAction: 'none',

                        {sign}{abbrev}

            };

            const Slot = ({ group, index }) => {
                const comp = slots[group][index];
                // Tier 2 flags the specific wrong slot (empty, or holding a term that doesn't
                // belong in this equation) without ever revealing what should go there instead.
                const showSlotFlag = checked && revealTier >= 2 && !groupCorrect[group];
                const slotWrong = showSlotFlag && !isSlotCorrect(group, index);
                const slotRight = checked && revealTier >= 2 && isSlotCorrect(group, index) && !groupCorrect[group];
                let borderColor = '#9ca3af';
                if (slotWrong) borderColor = '#dc2626';

                return (
                    <div
                        data-slot-group={group}

                        style={{

                            minHeight: '40px',
                            padding: '2px',

                            justifyContent: 'center',

                        {comp && <Tile comp={comp} />}
                    </div>
                );
            };

            // Tier 1 flags which whole equation has a problem, and confirms the ones that are right.
            const rowStyle = (group) => {
                if (!checked || revealTier < 1) return { border: '2px solid transparent', borderRadius: '8px', padding: '6px 10px' };
                const color = groupCorrect[group] ? '#16a34a' : '#dc2626';
                return { border: `2px solid ${color}`, borderRadius: '8px', padding: '6px 10px' };
            };

            return (
                <div>
                    <div className="flex gap-3 flex-wrap justify-center mb-8">

                    </div>

                        <span>w_net =</span>
                        <Slot group="wnet" index={0} /><span>+</span>
                        <Slot group="wnet" index={1} /><span>+</span>
                        <Slot group="wnet" index={2} />
                    </div>
                    <div className="flex items-center gap-2 text-xl font-semibold justify-center flex-wrap" style={rowStyle('qtotal')}>
                        <span>q_total =</span>
                        <Slot group="qtotal" index={0} /><span>+</span>
                        <Slot group="qtotal" index={1} />
                    </div>
                </div>
            );
        }

        function WorkHeatUnfoldAnimation({ t, workHeatPlacements, showFull, morphed }) {
            const comps = Object.keys(ENERGY_COMPONENT_POSITIONS).map((name, i) => {
                const { cx, cy } = ENERGY_COMPONENT_POSITIONS[name];
                const rowX = [30, 180, 330, 480, 630, 780][i];
                return { key: name, cx, cy, rowX, cat: workHeatPlacements[name] };
            });
            const rowY = 420;
            const ease = (x) => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
            const easeY = (x) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
            const moveWindow = 0.5;
            const holdEnd = 0.78;
            const moveT = Math.min(1, t / moveWindow);
            const etX = ease(moveT);
            const etY = easeY(moveT);
            const crossfadeT = Math.max(0, Math.min(1, (t - holdEnd) / (1 - holdEnd)));
            const clickPulse = crossfadeT > 0 && crossfadeT < 0.4 ? Math.sin(Math.PI * (crossfadeT / 0.4)) : 0;
            const pillStroke = 2 + clickPulse * 3;

            return (
                <svg viewBox="-20 50 840 480" className="w-full mx-auto" style={{ maxHeight: '360px', display: 'block' }}>
                    {comps.map(c => {
                        if (!c.cat) return null;
                        const style = ENERGY_CATEGORY_COLORS[c.cat];
                        const x = c.cx + (c.rowX - c.cx) * etX;
                        const y = c.cy + (rowY - c.cy) * etY;
                        const genericText = ENERGY_CATEGORY_DISPLAY[c.cat];
                        const sign = genericText[0];
                        const fullText = `${sign}${ENERGY_FULL_NAME[c.key]}`;
                        const abbrevText = `${sign}${ENERGY_ABBREV_NAME[c.key]}`;
                        const genericOpacity = showFull ? 0 : 1;
                        const fullOpacity = showFull && !morphed ? 1 : 0;
                        const abbrevOpacity = morphed ? 1 : 0;
                        return (
                            <g key={c.key} transform={`translate(${x},${y})`}>
                                <rect x="-58" y="-22" width="116" height="44" rx="10" fill={style.bg} stroke={style.border} strokeWidth={pillStroke}/>
                                <text x="0" y="6" textAnchor="middle" fontSize="14" fontWeight="bold" fill={style.text} opacity={genericOpacity} style={{ transition: 'opacity 700ms ease' }}>{genericText}</text>
                                <text x="0" y="6" textAnchor="middle" fontSize="13" fontWeight="bold" fill={style.text} opacity={fullOpacity} style={{ transition: 'opacity 700ms ease' }}>{fullText}</text>
                                <text x="0" y="6" textAnchor="middle" fontSize="14" fontWeight="bold" fill={style.text} opacity={abbrevOpacity} style={{ transition: 'opacity 1100ms ease' }}>{abbrevText}</text>
                            </g>
                        );
                    })}
                </svg>
            );
        }

        const LEVEL_1 = {
            // Phase 0a: Component placements
            components: ['PUMP', 'BOILER', 'HP TURB', 'REHEATER', 'LP TURB', 'CONDENSER'],
            correctComponentPlacements: {
                'PUMP': 'comp1-2',
                'BOILER': 'comp2-3',
                'HP TURB': 'comp3-4',
                'REHEATER': 'comp4-5',
                'LP TURB': 'comp5-6',
                'CONDENSER': 'comp6-1',
            },
            
            // Phase 0b: ISO connections
            isoConnections: {
                's1-s2': { from: 'state1-s', to: 'state2-s', type: 'isentropic', component: 'PUMP' },
                'P2-P3': { from: 'state2-P', to: 'state3-P', type: 'isobaric', component: 'BOILER' },
                's3-s4': { from: 'state3-s', to: 'state4-s', type: 'isentropic', component: 'HP TURB' },
                'P4-P5': { from: 'state4-P', to: 'state5-P', type: 'isobaric', component: 'REHEATER' },
                's5-s6': { from: 'state5-s', to: 'state6-s', type: 'isentropic', component: 'LP TURB' },
                'P6-P1': { from: 'state6-P', to: 'state1-P', type: 'isobaric', component: 'CONDENSER' },
            },
            
            // Phase 0c: Pink cells (given values) - x₁ = 0 is introduced later, via the
            // "Stuck?" reveal in Solve States, not as part of the initial given-values drop
            pinkCells: ['state3-P', 'state3-T', 'state4-P', 'state5-T', 'state6-P'],
            
            // Phase 0d: Blue cells (ONLY those derivable from pink + iso)
            // P₃ is pink → P₂=P₃ → P₂ is blue
            // P₄ is pink → P₄=P₅ → P₅ is blue
            // P₆ is pink → P₆=P₁ → P₁ is blue
            blueCells: ['state1-P', 'state2-P', 'state5-P'],
        };

        function RankineLevelOne() {
            const [phase, setPhase] = useState('component-id'); // Start with component identification
            const [completedPhases, setCompletedPhases] = useState([]);
            const [completedPhaseData, setCompletedPhaseData] = useState({}); // Store snapshots of completed phase data
            const [diagramPlacements, setDiagramPlacements] = useState({}); // NEW: Component ID on diagram
            const [componentPlacements, setComponentPlacements] = useState({});
            const [unfoldStarted, setUnfoldStarted] = useState(false); // True once student dismisses the Phase 1 success modal
            const unfoldSectionRef = React.useRef(null);
            React.useEffect(() => {

                if (unfoldStarted && unfoldSectionRef.current) {
