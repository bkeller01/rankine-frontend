                                    {eqCheckResult && Object.values(eqCheckResult).every(r => r.beforeCorrect && r.afterCorrect) && (
                                        <div>
                                            <p className="text-green-700 font-bold text-lg mb-3">
                                                ✓ All six equations are correct!
                                            </p>
                                            <button
                                                onClick={() => advancePhase('energy-values')}
                                                className="bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-6 rounded-lg"
                                            >
                                                Continue to Solve Energy Values →
                                            </button>
                                        </div>
                                    )}

                                    {eqCheckResult && !Object.values(eqCheckResult).every(r => r.beforeCorrect && r.afterCorrect) && (
                                        <div>
                                            <p className="text-red-700 font-semibold mb-3">
                                                Something's not quite right yet.
                                            </p>
                                            <div className="flex gap-3 justify-center flex-wrap">
                                                {eqRevealTier < 1 && (
                                                    <button
                                                        onClick={() => setEqRevealTier(1)}
                                                        className="bg-amber-500 hover:bg-amber-600 text-white font-semibold py-2 px-4 rounded-lg"
                                                    >
                                                        Show which equations have a problem
                                                    </button>
                                                )}
                                                {eqRevealTier === 1 && (
                                                    <button
                                                        onClick={() => setEqRevealTier(2)}
                                                        className="bg-amber-500 hover:bg-amber-600 text-white font-semibold py-2 px-4 rounded-lg"
                                                    >
                                                        Show which part is wrong
                                                    </button>
                                                )}
                                                <button
                                                    onClick={handleCheckEquations}
                                                    className="bg-indigo-500 hover:bg-indigo-600 text-white font-semibold py-2 px-4 rounded-lg"
                                                >
                                                    Check again
                                                </button>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            )}
                        </div>
                    )}

                    {/* Solve Energy Values Phase */}
                    {phase === 'energy-values' && (() => {
                        const comp = ENERGY_COMPONENT_ORDER[energyValueIndex];
                        const eq = equationAttempts[comp];
                        const cat = energyPlacements[comp];
                        const sign = ENERGY_CATEGORY_DISPLAY[cat][0];
                        const abbrev = ENERGY_ABBREV_NAME[comp];
                        const alreadySolved = energyResults[comp] !== undefined;
                        const isLast = energyValueIndex === ENERGY_COMPONENT_ORDER.length - 1;
                        const allSolved = ENERGY_COMPONENT_ORDER.every(c => energyResults[c] !== undefined);

                        if (allSolved && isLast && alreadySolved) {
                            return (
                                <div className="bg-white rounded-lg shadow-lg p-6 mb-6 text-center">
                                    <p className="text-green-700 font-bold text-xl mb-2">
                                        ✓ All six energy values calculated!
                                    </p>
                                    <div className="text-left inline-block mt-2">
                                        {ENERGY_COMPONENT_ORDER.map(c => (
                                            <p key={c} className="text-gray-700">
                                                {ENERGY_ABBREV_NAME[c]} = {energyResults[c]} kJ/kg
                                            </p>
                                        ))}
                                    </div>
                                    <div className="mt-4 flex gap-3 justify-center">
                                        <button
                                            onClick={() => setEnergyValueIndex(i => Math.max(0, i - 1))}
                                            className="bg-gray-400 hover:bg-gray-500 text-white font-semibold py-2 px-4 rounded-lg"
                                        >
                                            ← Review
                                        </button>
                                        <button
                                            onClick={() => advancePhase('cycle-performance')}
                                            className="bg-indigo-500 hover:bg-indigo-600 text-white font-semibold py-2 px-4 rounded-lg"
                                        >
                                            Continue to Cycle Performance →
                                        </button>
                                    </div>
                                </div>
                            );
                        }

                        return (
                            <div className="bg-white rounded-lg shadow-lg p-6 mb-6 text-center">

                                    Component {energyValueIndex + 1} of {ENERGY_COMPONENT_ORDER.length}
                                </p>
                                <h3 className="text-lg font-bold mb-4 text-gray-800">
                                    {comp}
                                </h3>
                                <p className="text-2xl font-semibold mb-4">
                                    h{eq.before} {sign} {abbrev} = h{eq.after}
                                </p>

                                {alreadySolved ? (
                                    <p className="text-green-700 font-bold text-lg mb-4">
                                        {abbrev} = {energyResults[comp]} kJ/kg
                                    </p>
                                ) : (
                                    <EnergyRearrange
                                        key={comp}
                                        comp={comp}
                                        eq={eq}
                                        sign={sign}
                                        abbrev={abbrev}
                                        hBeforeVal={parseHValue(givenValues[`state${eq.before}-h`])}
                                        hAfterVal={parseHValue(givenValues[`state${eq.after}-h`])}
                                        onComplete={(c, value) => {
                                            setEnergyResults(prev => {
                                                const next = { ...prev, [c]: value };
                                                const nowAllSolved = ENERGY_COMPONENT_ORDER.every(k => next[k] !== undefined);
                                                if (nowAllSolved) {
                                                    setCompletedPhaseData(cp => ({...cp, 'energy-values': { energyValueIndex, energyResults: next }}));
                                                    setCompletedPhases(cps => cps.includes('energy-values') ? cps : [...cps, 'energy-values']);
                                                }
                                                return next;
                                            });
                                        }}
                                    />
                                )}

                                <div className="flex gap-3 justify-center">
                                    {energyValueIndex > 0 && (
                                        <button
                                            onClick={() => setEnergyValueIndex(i => i - 1)}
                                            className="bg-gray-400 hover:bg-gray-500 text-white font-semibold py-2 px-4 rounded-lg"
                                        >
                                            ← Back
                                        </button>
                                    )}
                                    {alreadySolved && (
                                        <button
                                            onClick={() => setEnergyValueIndex(i => Math.min(ENERGY_COMPONENT_ORDER.length - 1, i + 1))}
                                            className="bg-indigo-500 hover:bg-indigo-600 text-white font-semibold py-2 px-4 rounded-lg"
                                        >
                                            {isLast ? 'Finish →' : 'Next component →'}
                                        </button>
                                    )}
                                </div>
                            </div>
                        );
                    })()}

                    {/* Cycle Performance Phase */}
                    {phase === 'cycle-performance' && (() => {
                        const isSlotCorrect = (group, idx) => {
                            const comp = cyclePerfSlots[group][idx];

                        const wnetCorrect = cyclePerfSlots.wnet.every((c, i) => isSlotCorrect('wnet', i));
                        const qtotalCorrect = cyclePerfSlots.qtotal.every((c, i) => isSlotCorrect('qtotal', i));
                        const allCorrect = wnetCorrect && qtotalCorrect;

                        const buildEquationParts = (group) => cyclePerfSlots[group].map(comp => ({
                            comp,
                            sign: CYCLE_PERF_SIGN[energyPlacements[comp]],
                            val: Number(energyResults[comp]),
                        }));
                        const sumParts = (parts) => parts.reduce((acc, p) => acc + (p.sign === '\u2212' ? -p.val : p.val), 0);
                        const renderEquationText = (parts) => parts.map((p, i) => {
                            if (i === 0) return `${p.sign === '\u2212' ? '\u2212' : ''}${p.val}`;

                        const handleSetSlots = (updater) => {

                                                            })

        function RubberBand({ sourceCell, mousePosition, targetCell, tableRef }) {
            const [sourceCellElement, setSourceCellElement] = React.useState(null);
            const [targetCellElement, setTargetCellElement] = React.useState(null);
            
            React.useEffect(() => {
                if (tableRef.current && sourceCell) {
                    // Find the source cell element by its id attribute
                    const cellElements = tableRef.current.querySelectorAll('td');
                    for (let cell of cellElements) {
                        if (cell.getAttribute('data-cell-id') === sourceCell) {
                            setSourceCellElement(cell);
                            break;
                        }
                    }
                }
            }, [sourceCell, tableRef]);
            
            React.useEffect(() => {
                if (tableRef.current && targetCell) {
                    const cellElements = tableRef.current.querySelectorAll('td');
                    for (let cell of cellElements) {
                        if (cell.getAttribute('data-cell-id') === targetCell) {
                            setTargetCellElement(cell);
                            break;
                        }
                    }
                } else {
                    setTargetCellElement(null);
                }
            }, [targetCell, tableRef]);
            
            if (!sourceCellElement) return null;
            
            // Don't render if mouse position hasn't been initialized (still at 0,0)
            if (mousePosition.x === 0 && mousePosition.y === 0) return null;
            
            const sourceRect = sourceCellElement.getBoundingClientRect();
            const sourceCenterX = sourceRect.left + sourceRect.width / 2;
            const sourceCenterY = sourceRect.top + sourceRect.height / 2;
            
            let endX = mousePosition.x;
            let endY = mousePosition.y;
            
            // If hovering over a valid target, snap to its center
            if (targetCellElement) {
                const targetRect = targetCellElement.getBoundingClientRect();
                endX = targetRect.left + targetRect.width / 2;
                endY = targetRect.top + targetRect.height / 2;
            }
            
            // Calculate control point for curved line (quadratic bezier)
            const midX = (sourceCenterX + endX) / 2;
            const midY = (sourceCenterY + endY) / 2;
            const distance = Math.sqrt(Math.pow(endX - sourceCenterX, 2) + Math.pow(endY - sourceCenterY, 2));
            const curvature = Math.min(distance * 0.2, 50); // Slight curve
            
            // Perpendicular offset for curve
            const dx = endX - sourceCenterX;
            const dy = endY - sourceCenterY;
            const perpX = -dy / distance * curvature;
            const perpY = dx / distance * curvature;
            
            const controlX = midX + perpX;
            const controlY = midY + perpY;
            
            return (
                <svg
                    style={{
                        position: 'fixed',
                        top: 0,
                        left: 0,
                        width: '100%',
                        height: '100%',
                        pointerEvents: 'none',
                        zIndex: 9999
                    }}
                >
                    {/* Rubber band line */}
                    <path
                        d={`M ${sourceCenterX} ${sourceCenterY} Q ${controlX} ${controlY} ${endX} ${endY}`}
                        stroke="#a855f7"
                        strokeWidth="4"
                        fill="none"
                        strokeDasharray="8,4"
                        opacity="0.8"
                    />
                    {/* Source dot */}
                    <circle
                        cx={sourceCenterX}
                        cy={sourceCenterY}
                        r="6"
                        fill="#a855f7"
                    />
                    {/* End dot */}
                    <circle
                        cx={endX}
                        cy={endY}
                        r="6"
                        fill={targetCellElement ? "#10b981" : "#a855f7"}
                    />
                </svg>
            );
        }

        function TableView({ phase, isoSubStep, componentPlacements, energyPlacements, energyResults, hOnlyView, activeEqComponent, eqBuilderClicks, equationAttempts, eqCheckResult, eqRevealTier, handleEqComponentClick, handleEqHClick, isoConnections, previewConnection, pinkHighlights, blueHighlights, calculatedCells, givenValues, selectedState, clickedCells, solveQueue, currentFind, currentUsing, handleStateClick, handleCellClickForSolving, handleDrop, handleDragOver, handleDragStart, handleMouseEnter, handleMouseLeave, handleDragEnd, dragFromCell, mousePosition, hoveredCell }) {
            const tableRef = React.useRef(null);

        function ComponentSlot({ id, placement, phase, activeEqComponent, equationAttempts, handleEqComponentClick }) {
            const hasComponent = !!placement;
            
            // Map each component to its colors from the cycle diagram
            const getComponentColors = (componentName) => {
                const colorMap = {
                    'PUMP': { bg: '#93c5fd', border: '#1e40af' },        // light blue bg, dark blue border
                    'BOILER': { bg: '#fca5a5', border: '#b91c1c' },      // light red bg, red border
                    'HP TURB': { bg: '#86efac', border: '#15803d' },     // light green bg, green border
                    'REHEATER': { bg: '#fca5a5', border: '#b91c1c' },    // light red bg, red border
                    'LP TURB': { bg: '#86efac', border: '#15803d' },     // light green bg, green border
                    'CONDENSER': { bg: '#a5b4fc', border: '#3730a3' }    // light indigo bg, indigo border
                };
                return colorMap[componentName] || { bg: '#93c5fd', border: '#3b82f6' };
            };

            const isEqPhase = phase === 'energy-equations';
            const isActive = isEqPhase && hasComponent && activeEqComponent === placement;
            const isClickableForEq = isEqPhase && hasComponent;
            
            let slotClass = "px-2 py-1 text-sm font-semibold text-center rounded-lg transition min-h-[24px] flex items-center justify-center";
            // Uniform width matching widest component (CONDENSER = 100px)
            slotClass += " w-[100px]";
            
            if (hasComponent) {
                // Colored background and border with black text, matching cycle diagram
                slotClass += " border-2 text-black";
            } else {
                slotClass += " bg-white border-2 border-dashed border-gray-300 text-gray-300";
            }

            if (isClickableForEq) {
                slotClass += " cursor-pointer hover:ring-2 hover:ring-orange-300";
            }
            if (isActive) {
                slotClass += " ring-4 ring-orange-400";
            }
            
            const customStyle = hasComponent ? { 
                backgroundColor: getComponentColors(placement).bg,
                borderColor: getComponentColors(placement).border
            } : {};
            
            return (
                <th
                    className={slotClass}
                    style={customStyle}
                    onClick={isClickableForEq ? () => handleEqComponentClick(placement) : undefined}
                >
                    {hasComponent ? placement : ''}
                </th>
            );
        }

        function PropertyRow({ property, labels, phase, isoSubStep, isoConnections, previewConnection, pinkHighlights, blueHighlights, calculatedCells, givenValues, selectedState, clickedCells, solveQueue, currentFind, currentUsing, handleCellClickForSolving, handleDrop, handleDragOver, handleDragStart, handleMouseEnter, handleMouseLeave, handleDragEnd, activeEqComponent, eqBuilderClicks, handleEqHClick }) {
            const states = [1, 2, 3, 4, 5, 6];
            const components = ['PUMP', 'BOILER', 'HP TURB', 'REHEATER', 'LP TURB', 'CONDENSER'];
            
            // Show spanning boxes from process-type onward (not during component-id / diagram labelling)
            const showSpanningBoxes = phase !== 'component-id';
            
            return (
                <tr className="relative" style={{position: 'relative'}}>
                    {showSpanningBoxes ? 
                        <CondenserWrapCell property={property} isoConnections={isoConnections} side="left" /> :
                        <td className="w-24"></td>
                    }
                    {states.map((state, idx) => {
                        const cellId = `state${state}-${property}`;
                        const label = labels[idx];
                        const isEmpty = !label;
                        
                        return (
                            <React.Fragment key={state}>
                                <Cell 
                                    id={cellId}
                                    label={label}
                                    isEmpty={isEmpty}
                                    phase={phase}
                                    isoSubStep={isoSubStep}
                                    isoConnections={isoConnections}
                                    previewConnection={previewConnection}
                                    pinkHighlights={pinkHighlights}
                                    blueHighlights={blueHighlights}
                                    calculatedCells={calculatedCells}
                                    givenValues={givenValues}
                                    selectedState={selectedState}
                                    clickedCells={clickedCells}
                                    solveQueue={solveQueue}
                                    currentFind={currentFind}
                                    currentUsing={currentUsing}
                                    handleCellClickForSolving={handleCellClickForSolving}
                                    handleDrop={handleDrop}
                                    handleDragOver={handleDragOver}
                                    handleDragStart={handleDragStart}
                                    handleMouseEnter={handleMouseEnter}
                                    handleMouseLeave={handleMouseLeave}
                                    handleDragEnd={handleDragEnd}
                                    activeEqComponent={activeEqComponent}
                                    eqBuilderClicks={eqBuilderClicks}
                                    handleEqHClick={handleEqHClick}
                                />
                                {idx < 5 && (
                                    showSpanningBoxes ? 
                                    <SpanningBoxCell 
                                        component={components[idx]}
                                        property={property}
                                        isoConnections={isoConnections}
                                        fromState={state}
                                        toState={state + 1}
                                        phase={phase}
                                    /> :
                                    <IsoBoxIndicator 
                                        component={components[idx]}
                                        property={property}
                                        isoConnections={isoConnections}
                                        previewConnection={previewConnection}
                                    />
                                )}
                            </React.Fragment>
                        );
                    })}
                    {showSpanningBoxes ? 
                        <CondenserWrapCell property={property} isoConnections={isoConnections} side="right" /> :
                        <IsoBoxIndicator 
                            component={components[5]}
                            property={property}
                            isoConnections={isoConnections}
                            previewConnection={previewConnection}
                        />
                    }
                </tr>
            );
        }

        // Spanning box that visually wraps both connected cells
        // Condenser connects state 6 back to state 1, wrapping around the table - unlike every
        // other connection, it doesn't sit between two adjacent real cells with a natural gap
        // cell already between them. This gives it its own dedicated empty spacer cell (one
        // placed before state 1, one after state 6), built exactly like the working
        // SpanningBoxCell gap cells - same base cell, same reach, same -10% height -
        // except each one only has ONE real neighbor to reach into, so the box is left open
        // (no border) on the side facing the table's outer edge instead of reaching both ways.
        function CondenserWrapCell({ property, isoConnections, side }) {
            const connection = isoConnections.find(conn => conn.component === 'CONDENSER');
            if (!connection) return <td className="w-24"></td>;
            if (property === 'P' && connection.type !== 'isobaric') return <td className="w-24"></td>;
            if (property === 's' && connection.type !== 'isentropic') return <td className="w-24"></td>;
            if (property !== 'P' && property !== 's') return <td className="w-24"></td>;

            const isLeft = side === 'left'; // 'left' = before state 1 (reaches right into P1/s1)
                                             // 'right' = after state 6 (reaches left into P6/s6)
            return (
                <td className="relative w-24" style={{position: 'relative', zIndex: 1}}>
                    <div className={`absolute border-2 border-black bg-white bg-opacity-30 ${isLeft ? 'border-l-0 rounded-r-lg' : 'border-r-0 rounded-l-lg'}`}
                         style={{
                             left: isLeft ? '-8px' : '-140px',
                             right: isLeft ? '-140px' : '-8px',
                             top: '-10%',
                             bottom: '-10%',
                             zIndex: 1,
                         }}
                    />
                    {/* Label positioned independently of the border box, rather than centered
                        inside it. The box reaches asymmetrically (mostly into the neighboring
                        cell, barely on the open side), so a centered label mostly landed inside
                        that neighbor's own cell - this cell's own edge, thanks to the table's
                        borderSpacing, already sits a few pixels clear of the neighbor's edge, so
                        anchoring the label there keeps it reliably outside the neighbor's cell
                        regardless of how far the box itself reaches. */}
                    <div className="absolute flex items-center justify-center"
                         style={{
                             [isLeft ? 'right' : 'left']: isLeft ? '8px' : '20px',
                             top: '50%',
                             transform: 'translateY(-50%)',
                             whiteSpace: 'nowrap',
                             zIndex: 50,
                         }}
                    >
                        <span className="text-xs font-bold uppercase text-gray-800">
                            {connection.type}
                        </span>
                    </div>
                </td>
            );
        }

        function SpanningBoxCell({ component, property, isoConnections, fromState, toState, isCondenser, phase }) {
            const connection = isoConnections.find(conn => conn.component === component);
            
            if (!connection) return <td className="w-24"></td>;
            
            // CONDENSER has special wrap-around handling, don't show regular spanning box
            if (component === 'CONDENSER') {
                return <td className="w-24"></td>;
            }
            
            const connProperty = connection.from.split('-')[1];
            
            // Only show if this connection affects the current property
            if (property === 'P' && connection.type !== 'isobaric') return <td className="w-24"></td>;
            if (property === 's' && connection.type !== 'isentropic') return <td className="w-24"></td>;
            if (property !== 'P' && property !== 's') return <td className="w-24"></td>;
            
            // Border style is the same regardless of phase - previously a no-op ternary
            const borderStyle = 'border-2 border-black';
            
            // For condenser, just extend normally (we'll handle wrap-around differently)
            // For all components, extend equally on all sides
            return (
                <td className="relative w-24" style={{position: 'relative', zIndex: 1}}>
                    <div className={`absolute ${borderStyle} bg-white bg-opacity-30 rounded-lg flex items-center justify-center`}
                         style={{
                             // Fixed pixels, not a percentage of this gap cell's own width. The
                             // table has no fixed column widths (table-layout: auto + w-full), so
                             // a % reach only ever looks right at one specific window width and
                             // drifts everywhere else - a fixed distance stays correct regardless
                             // of viewport size, now that the table's max width is also capped so
                             // cells can't stretch unboundedly wide in the first place.
                             left: '-140px',
                             right: '-140px',
                             top: '-10%',
                             bottom: '-10%',
                             zIndex: 1,
                         }}>
                        <span className="text-xs font-bold uppercase text-gray-800">
                            {connection.type}
                        </span>
                    </div>
                </td>
            );
        }

        function IsoBoxIndicator({ component, property, isoConnections, previewConnection }) {
            // CONDENSER has special wrap-around handling, don't show regular box
            if (component === 'CONDENSER') {
                return <td className="w-24"></td>;
            }
            
            // Find permanent connection for this component
            const connection = isoConnections.find(conn => conn.component === component);
            
            // Check preview connection
            const hasPreview = previewConnection && previewConnection.component === component;
            
            if (!connection && !hasPreview) {
                return <td className="w-24"></td>;
            }
            
            const displayConn = connection || previewConnection;
            
            // Only show box if this property matches the connection type
            // isobaric connections appear in P row
            // isentropic connections appear in s row
            if (property === 'P' && displayConn.type !== 'isobaric') {
                return <td className="w-24"></td>;
            }
            if (property === 's' && displayConn.type !== 'isentropic') {
                return <td className="w-24"></td>;
            }
            if (property !== 'P' && property !== 's') {
                return <td className="w-24"></td>;
            }
            
            const isPreview = !connection && hasPreview;
            
            return (
                <td className="relative w-24">
                    <div className={`
                        border-2 rounded-lg p-2 flex items-center justify-center h-full min-h-[60px]
                        ${isPreview ? 'border-gray-400 bg-white opacity-50' : 'border-black bg-white'}
                    `}>
                        <span className={`text-xs font-bold uppercase text-center
                            ${isPreview ? 'text-gray-500' : 'text-gray-800'}
                        `}>
                            {displayConn.type}
                        </span>
                    </div>
                </td>
            );
        }

        // Simpler approach: Render boxes that highlight connected cells with thicker borders
        function IsoConnectionBox({ connection, isPreview, property }) {
            const fromState = parseInt(connection.from.split('-')[0].replace('state', ''));
            const toState = parseInt(connection.to.split('-')[0].replace('state', ''));
            const fromProp = connection.from.split('-')[1];
            
            // Only render if this connection is for the current property row
            if (fromProp !== property) return null;
            
            // For now, just highlight the cells - spanning boxes require more complex positioning
            // Let's go back to the component column approach but make it work better
            return null;
        }

        function Cell({ id, label, isEmpty, phase, isoSubStep, isoConnections, previewConnection, pinkHighlights, blueHighlights, calculatedCells, givenValues, selectedState, clickedCells, solveQueue, currentFind, currentUsing, handleCellClickForSolving, handleDrop, handleDragOver, handleDragStart, handleMouseEnter, handleMouseLeave, handleDragEnd, activeEqComponent, eqBuilderClicks, handleEqHClick }) {
            if (isEmpty) {
                return <td className="w-40 border-2 border-gray-200 bg-gray-50 p-2 text-sm rounded-lg"></td>;
            }

            const hasPink = pinkHighlights.includes(id);
            const hasBlue = blueHighlights.includes(id);
            const hasYellow = calculatedCells && calculatedCells.includes(id);
            
            // Check if this cell is part of a permanent ISO connection
            const isConnected = isoConnections.some(conn => conn.from === id || conn.to === id);
            
            // Check if this cell is part of preview connection
            const isPreviewConnected = previewConnection && 
                                      (previewConnection.from === id || previewConnection.to === id);
            
            // Check if this cell has a value
            const hasValue = givenValues && givenValues[id] !== undefined;
            
            // In the connect sub-step: all cells are draggable
            // In the derive sub-step: only pink cells are draggable (source cells)
            // In solve-states: cells with values are draggable
            const isDraggable = (phase === 'iso-processes' && isoSubStep === 'connect') || 
                               (phase === 'iso-processes' && isoSubStep === 'derive' && hasPink) ||
                               (phase === 'solve-states' && hasValue);
            
            const property = id.split('-')[1];
            
            let cellClass = "w-40 p-2 text-sm rounded-lg transition min-h-[44px] relative";
            
            // Priority: pink > blue > yellow > connected (only in Phase 0b) > preview > default
            if (hasPink) {
                cellClass += " border-4 border-pink-500 bg-pink-100 z-10";
            } else if (hasBlue) {
                cellClass += " border-4 border-blue-500 bg-blue-100 z-10";
            } else if (hasYellow) {
                cellClass += " border-4 border-yellow-400 bg-yellow-50 z-10";
            } else if (isPreviewConnected && phase === 'iso-processes') {
                // Preview cells get prominent purple border and background
                cellClass += " border-4 border-purple-400 bg-purple-50 z-10 ring-2 ring-purple-300";
            } else {
                cellClass += " border-2 border-gray-300 bg-white z-10";
            }
            
            if (isDraggable) {
                cellClass += " cursor-move hover:ring-2 hover:ring-purple-400";
            }
            
            // Make cells clickable in solve-states phase ONLY for the selected state
            // Parse state number from cell id (e.g., "state3-P" -> 3)
            const cellStateNum = parseInt(id.split('-')[0].replace('state', ''));
            
            // Check if this entire state is complete (all properties with labels have values)
            // Define which states have which properties (x only exists at saturated states)
            const getRequiredProperties = (stateNum) => {
                const allStates = ['P', 'T', 'h', 's'];
                // Only states 1 and 6 have quality (saturated liquid at condenser outlet)
                if (stateNum === 1 || stateNum === 6) {
                    return [...allStates, 'x'];
                }
                return allStates;
            };
            
            const requiredProperties = getRequiredProperties(cellStateNum);
            const isStateComplete = requiredProperties.every(prop => {
                const cellId = `state${cellStateNum}-${prop}`;
                return givenValues && givenValues[cellId] !== undefined;
            });
            
            // Check if this cell has been found (solved for) - either in queue or as current find
            const isBeingFound = currentFind === id;
            const isInQueue = solveQueue && solveQueue.some(entry => entry.find === id);
            const hasBeenFound = isBeingFound || isInQueue;
            
            const isClickableForSolving = phase === 'solve-states' && selectedState !== null && cellStateNum === selectedState && !hasBeenFound && !isStateComplete;
            
            if (isClickableForSolving) {
                cellClass += " cursor-pointer hover:ring-2 hover:ring-orange-300";
            }

            // Make h-cells clickable in the energy-equations phase, for any state,
            // only while a component is active and we're expecting an h-click (1st or 3rd click)
            const isClickableForEq = phase === 'energy-equations' && property === 'h' && !!activeEqComponent &&
                eqBuilderClicks && eqBuilderClicks.length < 2;

            if (isClickableForEq) {
                cellClass += " cursor-pointer hover:ring-2 hover:ring-indigo-300";
            }
            
            // Add grab cursor for draggable cells in solve-states
            if (isDraggable && phase === 'solve-states' && hasValue) {
                cellClass += " cursor-grab";
            }
            
            // Gray out cells if entire state is complete OR if cell has been found
            if ((isStateComplete || hasBeenFound) && phase === 'solve-states') {
                cellClass += " opacity-40";
                // Don't add cursor-not-allowed if the cell is draggable
                if (!isDraggable) {
                    cellClass += " cursor-not-allowed";
                }
            }

            return (
                <td
                    data-cell-id={id}
                    className={cellClass}
                    style={{position: 'relative', zIndex: 10}}
                    draggable={isDraggable}
                    onDragStart={isDraggable ? (e) => handleDragStart(e, 'cell', id) : undefined}
                    onDragEnd={isDraggable ? handleDragEnd : undefined}
                    onDrop={(e) => handleDrop(e, id)}
                    onDragOver={handleDragOver}
                    onMouseEnter={() => handleMouseEnter && handleMouseEnter(id)}
                    onMouseLeave={handleMouseLeave}
                    onClick={isClickableForSolving ? () => handleCellClickForSolving(id) : (isClickableForEq ? () => handleEqHClick(cellStateNum) : undefined)}
                >
                    <div className="text-center">
                        {givenValues[id] ? (
                            <div className="flex items-baseline justify-center gap-1 flex-wrap">
                                <span className="font-semibold text-gray-700 text-xs">{label}:</span>
                                <span className="text-gray-900 font-bold text-xs">{givenValues[id]}</span>
                            </div>
                        ) : (
                            <div className="font-semibold text-gray-700">{label}:</div>
                        )}
                    </div>
                </td>
            );
        }

        // Component to create spanning boxes between connected cells
        function SpanningBoxes({ isoConnections, previewConnection, property }) {
            const boxes = [];
            
            // Add permanent connections
            isoConnections.forEach(conn => {
                const fromProp = conn.from.split('-')[1];
                const toProp = conn.to.split('-')[1];
                
                if (fromProp === property && toProp === property) {
                    boxes.push({ ...conn, isPreview: false });
                }
            });
            
            // Add preview connection
            if (previewConnection) {
                const fromProp = previewConnection.from.split('-')[1];
                const toProp = previewConnection.to.split('-')[1];
                
                if (fromProp === property && toProp === property) {
                    boxes.push({ ...previewConnection, isPreview: true });
                }
            }
            
            return (
                <>
                    {boxes.map((box, idx) => {
                        const fromState = parseInt(box.from.split('-')[0].replace('state', ''));
                        const toState = parseInt(box.to.split('-')[0].replace('state', ''));
                        
                        // Determine which component column this spans
                        let colSpan = Math.abs(toState - fromState) * 2 + 1; // cells + gaps
                        let startCol = Math.min(fromState, toState);
                        
                        const isPreview = box.isPreview;
                        
                        return (
                            <div 
                                key={`${box.from}-${box.to}-${idx}`}
                                className={`absolute border-4 rounded-lg flex items-center justify-center pointer-events-none transition-all
                                    ${isPreview ? 'border-purple-400 bg-purple-100 opacity-80 animate-pulse' : 'border-purple-500 bg-purple-100'}`}
                                style={{
                                    left: `${(startCol - 1) * 16.67}%`,
                                    width: `${(toState - startCol + 1) * 16.67 + (toState - startCol) * 0.5}%`,
                                    top: '0',
                                    bottom: '0',
                                    height: '100%',
                                    zIndex: isPreview ? 5 : 1,
                                }}
                            >
                                <span className={`text-xs font-bold uppercase ${isPreview ? 'text-purple-600' : 'text-purple-700'}`}>
                                    {box.type}
                                </span>
                            </div>
                        );
                    })}
                </>
            );
        }

        ReactDOM.render(<RankineLevelOne />, document.getElementById('root'));
    </script>
</body>
</html>
